  function renderView() {
    clearAnimationTimeouts();
    const item = DATA[currentIndex];
    
    document.getElementById('q-status-text').innerText = `Question ${item.id} / 251`;
    document.getElementById('p-bar').style.width = `${(item.id / 251) * 100}%`;

    document.getElementById('main-topic').innerText = `මාතෘකාව: ${item.mt}`;
    document.getElementById('sub-topic').innerText = `අනු මාතෘකාව: ${item.st}`;

    document.getElementById('s2-en').innerText = `Q${item.id}: ${item.qe}`;
    document.getElementById('s2-si').innerText = `ප්‍ර: ${item.qs}`;

    document.getElementById('s3-ans-en').innerText = item.ae;
    document.getElementById('s3-ans-si').innerText = item.as;

    document.getElementById('s5-ans-en').innerText = item.ae;
    document.getElementById('s5-ans-si').innerText = item.as;

    const svgCode = ACCURATE_SVGS[item.vt] || ACCURATE_SVGS.ANSWER_GENERIC;
    document.getElementById('s3-svg-holder').innerHTML = svgCode;

    document.getElementById('s1-icon').innerText = item.ic;
    document.getElementById('s1-title').innerText = `Q#${item.id} Care Procedure`;
    document.getElementById('s1-sub').innerText = `Page ${item.p} Reference`;

    document.getElementById('btn-prev').disabled = (currentIndex === 0);
    document.getElementById('btn-next').disabled = (currentIndex === DATA.length - 1);

    startAnimationSequence();
  }

  function showScene(sceneId) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    const sc = document.getElementById(sceneId);
    if (sc) sc.classList.add('active');
  }

  function startAnimationSequence() {
    clearAnimationTimeouts();
    document.getElementById('quizBox').innerText = '❓';

    showScene('scene1');

    activeTimeouts.push(setTimeout(() => { showScene('scene2'); }, 1800));
    activeTimeouts.push(setTimeout(() => { showScene('scene3'); }, 4500));
    activeTimeouts.push(setTimeout(() => {
      showScene('scene4');
      activeTimeouts.push(setTimeout(() => { document.getElementById('quizBox').innerText = '💡'; }, 1000));
    }, 8500));
    activeTimeouts.push(setTimeout(() => { showScene('scene5'); }, 11000));
  }

  function navigate(dir) {
    currentIndex += dir;
    if (currentIndex < 0) currentIndex = 0;
    if (currentIndex >= DATA.length) currentIndex = DATA.length - 1;
    renderView();
  }

  function jumpToInput() {
    const val = parseInt(document.getElementById('jump-input').value);
    if (val >= 1 && val <= 251) {
      currentIndex = val - 1;
      renderView();
    }
  }

  function speakCurrentQuestion() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const item = DATA[currentIndex];
      const msg = new SpeechSynthesisUtterance(item.qe + ". " + item.ae);
      msg.lang = 'en-US';
      msg.rate = 0.9;
      window.speechSynthesis.speak(msg);
    }
  }

  function toggleDirectoryModal() {
    const modal = document.getElementById('directory-modal');
    modal.classList.toggle('active');
    if (modal.classList.contains('active')) {
      renderDirectoryGrid();
    }
  }

  function setDirectoryFilter(code, btn) {
    activeDirFilter = code;
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDirectoryGrid();
  }

  function filterDirectory() { renderDirectoryGrid(); }

  function renderDirectoryGrid() {
    const searchInput = document.getElementById('dir-search');
    const searchTxt = searchInput ? searchInput.value.toLowerCase() : "";
    const container = document.getElementById('dir-grid-container');
    if (!container) return;
    container.innerHTML = '';

    const filtered = DATA.filter(q => {
      const matchTopic = (activeDirFilter === 'ALL' || q.tc === activeDirFilter);
      const matchSearch = (
        q.id.toString().includes(searchTxt) ||
        q.qe.toLowerCase().includes(searchTxt) ||
        q.qs.toLowerCase().includes(searchTxt) ||
        q.ae.toLowerCase().includes(searchTxt)
      );
      return matchTopic && matchSearch;
    });

    filtered.forEach(q => {
      const div = document.createElement('div');
      div.className = `dir-item ${q.id === (currentIndex + 1) ? 'active' : ''}`;
      div.onclick = () => {
        currentIndex = q.id - 1;
        toggleDirectoryModal();
        renderView();
      };
      div.innerHTML = `<span class="q-num">${q.ic} Q${q.id}</span><span class="q-pg">Pg ${q.p}</span>`;
      container.appendChild(div);
    });
  }

  window.onload = renderView;
</script>

</body>
</html>
