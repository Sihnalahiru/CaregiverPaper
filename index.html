ly check with the care recipient to confirm their willingness and current personal preference regarding taking a bath.", "as": "ස්නානය කිරීමට ඔවුන්ගේ කැමැත්ත සහ මනාපය තිබේදැයි කල්තියා පරීක්ෂා කිරීම.", "p": 193, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 112, "qe": "What principles must be strictly enforced when performing a disposable diaper change for a bedridden resident?", "qs": "ඇඳටම වී සිටින සේවාලාභියෙකුට ඩයපර් මාරු කිරීමේදී දැඩි ලෙස බලාත්මක කළ යුතු මූලධර්ම මොනවාද?", "ae": "Protect personal privacy at all times, keep the body covered as much as possible, and execute the exchange quickly and efficiently.", "as": "පුද්ගලික පෞද්ගලිකත්වය සුරක්ෂිත කිරීම, ශරීරය හැකි තාක් ආවරණය කිරීම සහ ඉක්මනින් ක්‍රියාත්මක වීම.", "p": 170, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 113, "qe": "Under independence support concepts, how should a caregiver handle daily life tasks for a semi-dependent resident?", "qs": "ස්වාධීනත්වයට සහය වීමේ සංකල්ප යටතේ, අර්ධ-ස්වාධීන සේවාලාභියෙකුගේ දෛනික කටයුතු සත්කාරකයා හැසිරවිය යුත්තේ කෙසේද?", "ae": "Encourage and allow the care recipient to do everything they are physically capable of performing themselves, assisting only when needed.", "as": "තනිව කළ හැකි දේ කිරීමට දිරිගැන්වීම සහ අවශ්‍ය විට පමණක් උදව් කිරීම.", "p": 15, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 114, "qe": "What primary systemic function is executed by human sweat glands?", "qs": "මිනිස් දහඩිය ග්‍රන්ථි මඟින් ඉටු කරනු ලබන මූලික පද්ධතිමය කාර්යය කුමක්ද?", "ae": "Regulating internal body temperature by expelling moisture to cool the skin surface through evaporation.", "as": "වාෂ්පීකරණය හරහා සම සිසිල් කරමින් අභ්‍යන්තර ශරීර උෂ්ණත්වය නියාමනය කිරීම.", "p": 190, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 115, "qe": "When managing laundry duties for a resident living in an integrated care home, what should guide the worker?", "qs": "ඒකාබද්ධ සත්කාර නිවසක ජීවත් වන සේවාලාභියෙකුගේ රෙදි සේදීමේ කටයුතු කළමනාකරණය කිරීමේදී මඟ පෙන්විය යුත්තේ කුමන කරුණෙන්ද?", "ae": "Adhere strictly to designated sanitation guidelines while aligning closely with the resident's personal wishes and sorting preferences.", "as": "සනීපාරක්ෂක මාර්ගෝපදේශ දැඩි ලෙස පිළිපැදීම සහ සේවාලාභියාගේ පුද්ගලික මනාපයන්ට අනුකූල වීම.", "p": 204, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 116, "qe": "What is the correct procedure for moving a care recipient in a manual wheelchair down a steep incline?", "qs": "බෑවුමකින් පහළට අතින් ක්‍රියාත්මක වන රෝද පුටුවක් ගෙන යාමේ නිවැරදි ක්‍රියා පටිපාටිය කුමක්ද?", "ae": "Turn the wheelchair backward and walk slowly down facing uphill, maintaining clear control over the hand brakes.", "as": "රෝද පුටුව පසුපසට හරවා ඉහළට මුහුණලාගෙන සෙමින් පහළට බැසීම.", "p": 145, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 117, "qe": "What body alignment promotes safe swallowing mechanics during oral intake?", "qs": "මුඛයෙන් ආහාර ගැනීමේදී ආරක්ෂිත ගිලීමේ යාන්ත්‍ර විද්‍යාව ප්‍රවර්ධනය කරන ශරීර පෙළගැස්ම කුමක්ද?", "ae": "Sitting upright with the spine straight, back adequately supported, and the head tilted slightly forward with the chin tucked closely down.", "as": "කෙළින් වාඩි වී, හිස මඳක් ඉදිරියට නමා නිකට පහළට හරවා ගැනීම.", "p": 149, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 118, "qe": "Where should a care worker stand when assisting a resident walking with a single-point cane?", "qs": "තනි ලක්ෂ්‍ය වේවැලකින් ඇවිදින සේවාලාභියෙකුට උදව් කරන විට සත්කාරකයා සිටිය යුත්තේ කොතැනද?", "ae": "Stand diagonally behind the care recipient on their weaker or affected side to offer immediate stabilization if they stumble.", "as": "සේවාලාභියාගේ දුර්වල හෝ පීඩාවට පත් පැත්තෙන් විකර්ණ ලෙස පිටුපසින් සිටීම.", "p": 137, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 119, "qe": "What is the correct sequencing rule when putting a front-opening shirt on a resident with right-sided hemiplegia?", "qs": "දකුණු පස අංශභාගය ඇති සේවාලාභියෙකුට ඉදිරිපස විවෘත කමිසයක් ඇඳීමේදී අනුගමනය කළ යුතු නිවැරදි අනුපිළිවෙළ නීතිය කුමක්ද?", "ae": "Slide the sleeve onto the right arm (the affected/paralyzed side) first, following the rule of \"dress the affected side first.\"", "as": "පළමුව දකුණු අතට (පීඩාවට පත් පැත්තට) කමහ දැමීම.", "p": 176, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 120, "qe": "How does reducing the physical distance between a caregiver and a resident enhance safety during a lift?", "qs": "එසවීමකදී සත්කාරකයා සහ සේවාලාභියා අතර භෞතික දුර අඩු කිරීමෙන් ආරක්ෂාව වැඩි වන්නේ කෙසේද?", "ae": "Bringing your body as close as possible to the care recipient shortens the leverage arm, significantly lowering mechanical load on your lower back.", "as": "සේවාලාභියාට හැකි තරම් සමීප වීමෙන් පහළ පිටට යෙදෙන යාන්ත්‍රික බර අඩු වේ.", "p": 39, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 121, "qe": "What dual parameters are crucial to maintain simultaneously during restroom assistance?", "qs": "විශ්‍රාම ශාලා ආධාරක කාලය තුළ එකවර පවත්වා ගත යුතු ද්විත්ව පරාමිතීන් මොනවාද?", "ae": "Strictly shield the client's physical privacy while maintaining close environmental and positional safety parameters.", "as": "සේවාලාභියාගේ පෞද්ගලිකත්වය ආරක්ෂා කිරීම සහ ආරක්ෂිත පරාමිතීන් පවත්වා ගැනීම.", "p": 164, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 122, "qe": "What bodily positioning anatomically relaxes the rectum and facilitates easier bowel movements on a toilet?", "qs": "වැසිකිළියකදී ගුදය ව්‍යුහ විද්‍යාත්මකව ලිහිල් කර මලපහ පිටවීම පහසු කරන ශරීර ඉරියව්ව කුමක්ද?", "ae": "Leaning the upper body slightly forward while keeping the feet flat on the floor to maximize abdominal pressure naturally.", "as": "පාද බිම තබා උඩුකය මඳක් ඉදිරියට නැමීම.", "p": 158, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 123, "qe": "When walking beside a resident experiencing hemiparesis (one-sided weakness), where should the care worker stand?", "qs": "එක් පැත්තක දුර්වලතාවයක් (Hemiparesis) ඇති සේවාලාභියෙකු සමඟ ඇවිදින විට සත්කාරකයා සිටිය යුත්තේ කොතැනද?", "ae": "Position yourself diagonally behind them on the weaker (affected) side to serve as an immediate physical safety anchor.", "as": "දුර්වල පැත්තේ විකර්ණ ලෙස පිටුපසින් සිටීම.", "p": 137, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 124, "qe": "Where should a care worker position themselves when sitting down to feed an immobile care recipient?", "qs": "චලනය වීමට නොහැකි සේවාලාභියෙකුට ආහාර කැවීමට වාඩි වන විට සත්කාරකයා තමන් පිහිටුවිය යුත්තේ කොතැනද?", "ae": "Sit down at the exact same eye level as the resident, positioning your chair on their healthy, unaffected side.", "as": "සේවාලාභියාගේ නිරෝගී පැත්තෙන්, ඔවුන්ගේ ඇස් මට්ටමට වාඩි වීම.", "p": 152, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 125, "qe": "When introducing a spoonful of food to a resident with right-sided oral hemiplegia, where should the food be placed?", "qs": "මුඛයේ දකුණු පස අංශභාගය ඇති සේවාලාභියෙකුට හැන්දකින් ආහාර ලබා දීමේදී ආහාර තැබිය යුත්තේ කොතැනද?", "ae": "Direct the food spoon into the left side of the oral cavity (the unaffected side) to enable safe chewing and normal swallowing.", "as": "මුඛයේ වම් පැත්තට (නිරෝගී පැත්තට) ආහාර ලබා දීම.", "p": 153, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 126, "qe": "Under what conditions does the parasympathetic nervous system become active within the human body?", "qs": "මිනිස් සිරුර තුළ පරානුකම්පා ස්නායු පද්ධතිය (Parasympathetic nervous system) ක්‍රියාකාරී වන්නේ කුමන කොන්දේසි යටතේද?", "ae": "During periods of rest, sleep, relaxation, and calm states, serving to slow heart rates and facilitate digestion.", "as": "විවේකය, නින්දය සහ සන්සුන් අවස්ථාවන්හිදී හෘද ස්පන්දනය මන්දගාමී කරමින් ආහාර ජීර්ණයට උදව් කරයි.", "p": 58, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 127, "qe": "How should a care worker describe the location of different food items on a tray to a completely blind care recipient?", "qs": "සම්පූර්ණයෙන්ම අන්ධ සේවාලාභියෙකුට තැටියක ඇති විවිධ ආහාර අයිතමවල පිහිටීම සත්කාරකයා විස්තර කළ යුත්තේ කෙසේද?", "ae": "Utilize the standardized \"Clock Position\" system to describe placements clearly (e.g., \"Your rice is located at the 7 o'clock position\").", "as": "ඔරලෝසු කටු ක්‍රමය (Clock Position) භාවිත කර ආහාර පිහිටීම විස්තර කිරීම.", "p": 154, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "CLOCK_POSITION", "ic": "🕒"}, {"id": 128, "qe": "What physical support must a caregiver provide when helping a hemiplegic resident sit up on the side of the bed to prevent knee buckling?", "qs": "අංශභාගය ඇති සේවාලාභියෙකු ඇඳ කෙළවරේ වාඩි වීමට උදව් කිරීමේදී දණහිස නැමීම වැළැක්වීමට දිය යුතු භෞතික සහයෝගය කුමක්ද?", "ae": "Support the knee joint on their affected (paralyzed) side securely to stabilize their posture and prevent a sudden collapse forward.", "as": "අංශභාගය ඇති පසෙහි දණහිස ආරක්ෂා කරමින් සහයෝගය ලබා දීම.", "p": 136, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 129, "qe": "What behavioral modifications should a care worker use when communicating with a resident diagnosed with moderate dementia?", "qs": "මධ්‍යස්ථ ඩිමෙන්ශියාව ඇති සේවාලාභියෙකු සමඟ සන්නිවේදනය කිරීමේදී සත්කාරකයා භාවිත කළ යුතු හැසිරීම් වෙනස්කම් මොනවාද?", "ae": "Lower your posture to align precisely at their eye level, speak slowly using clear words, and maintain a calm, unhurried tone.", "as": "ඔවුන්ගේ ඇස් මට්ටමට පහත් වී, සෙමින්, පැහැදිලි වචනවලින් කතා කිරීම.", "p": 116, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 130, "qe": "Which major organ of the human gastrointestinal tract is primarily responsible for the chemical absorption of life nutrients?", "qs": "මිනිස් ආමාශයික පද්ධතියේ පෝෂ්‍ය පදාර්ථ රසායනිකව අවශෝෂණය කරගැනීමට ප්‍රධාන වශයෙන් වගකිවයුතු ප්‍රධාන අවයවය කුමක්ද?", "ae": "The small intestine.", "as": "කුඩා අන්ත්‍රය (Small intestine).", "p": 65, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 131, "qe": "Dressing Assistance for Hemiplegia: When assisting a care recipient with left-sided hemiplegia to put on a front-button shirt, which procedure is correct?", "qs": "අංශභාගය සඳහා ඇඳුම් ඇඳීමේ සහය: වම් පස අංශභාගය ඇති සේවාලාභියෙකුට ඉදිරිපස බොත්තම් දැමූ කමිසයක් ඇඳීමට උදව් කිරීමේදී නිවැරදි ක්‍රියා පටිපාටිය කුමක්ද?", "ae": "Put the shirt sleeve onto the left arm (affected side) first, and remove it from the right arm (unaffected side) first.", "as": "වම් අතට (පීඩාවට පත් පැත්තට) කමහ කමහ දැමීම සහ දකුණු අතින් (නිරෝගී පැත්තෙන්) පළමුව ගැලවීම.", "p": 176, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 132, "qe": "Transferring from Bed to Wheelchair: When helping a care recipient transfer from a bed to a wheelchair, where should the wheelchair be positioned?", "qs": "ඇඳේ සිට රෝද පුටුවට මාරු කිරීම: ඇඳේ සිට රෝද පුටුවට සේවාලාභියා මාරු කිරීමට උදව් කරන විට රෝද පුටුව තැබිය යුත්තේ කොතැනද?", "ae": "Position the wheelchair on the care recipient's unaffected (healthy) side at an angle of 30 to 45 degrees to the bed.", "as": "ඇඳට සාපේක්ෂව අංශක 30 ත් 45 ත් අතර කෝණයකින් සේවාලාභියාගේ නිරෝගී පැත්තෙන් රෝද පුටුව තැබීම.", "p": 140, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "WHEELCHAIR_ANGLE", "ic": "🧑‍ෲ"}, {"id": 133, "qe": "Assisting with Toileting: What is the most important consideration for maintaining dignity when assisting a care recipient with toileting?", "qs": "වැසිකිළි ආධාරක: සේවාලාභියෙකුට වැසිකිළි අවශ්‍යතා සඳහා උදව් කිරීමේදී ගෞරවය රැක ගැනීමට ඇති වැදගත්ම සැලකිල්ල කුමක්ද?", "ae": "Close the door or curtain to ensure privacy, and do not watch them continuously unless safety requires it.", "as": "පෞද්ගලිකත්වය සුරක්ෂිත කිරීමට දොර හෝ තිරය වසා දැමීම සහ නිරන්තරයෙන් බලා නොසිටීම.", "p": 164, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 134, "qe": "Understanding Dementia: Which statement accurately describes the core characteristics of dementia?", "qs": "ඩිමෙන්ශියාව තේරුම් ගැනීම: ඩිමෙන්ශියාවේ මූලික ලක්ෂණ නිවැරදිව විස්තර කරන්නේ කුමන ප්‍රකාශයද?", "ae": "It is a condition where cognitive functions, such as memory and judgment, decline due to brain disease, interfering with daily life.", "as": "මොළයේ රෝගයක් නිසා මතකය සහ විනිශ්චය වැනි සංජානන ක්‍රියාකාරකම් පිරිහෙන තත්ත්වයකි.", "p": 91, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 135, "qe": "Wheelchair Safety on Slopes: When moving a care recipient in a wheelchair down a steep slope, how should the care worker proceed?", "qs": "බෑවුම්වල රෝද පුටු ආරක්ෂාව: බෑවුමකින් රෝද පුටුව පහළට ගෙන යන විට සත්කාරකයා ක්‍රියා කළ යුත්තේ කෙසේද?", "ae": "Turn the wheelchair backward and descend smoothly while looking back to check the path.", "as": "රෝද පුටුව පසුපසට හරවා මඟ බලාගනිමින් පරිස්සමින් පහළට බැසීම.", "p": 145, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 136, "qe": "Proper Nail Care: What is the correct way to trim a care recipient's nails safely to prevent ingrown nails and injury?", "qs": "නිසි නිය සත්කාර: නියපොතු ඇතුළට වැවීම සහ තුවාල වීම වැළැක්වීම සඳහා නියපොතු කැපිය යුතු නිවැරදි ක්‍රමය කුමක්ද?", "ae": "Cut the nails straight across horizontally, and then gently round off the sharp corners with a file.", "as": "නියපොතු තිරස් අතට කෙළින් කපා, පසුව ෆයිල් එකකින් මුවහත් කෙළවරවල් වටකුරු කිරීම.", "p": 184, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 137, "qe": "Dietary Support for Hemiplegia: How should a care worker assist a user with right-sided hemiplegia who faces difficulties during meals?", "qs": "අංශභාගය සඳහා ආහාර සහය: ආහාර ගැනීමේදී අපහසුතා ඇති දකුණු පස අංශභාගය ඇති පරිශීලකයෙකුට සත්කාරකයා උදව් කළ යුත්තේ කෙසේද?", "ae": "Support their posture using cushions so they lean slightly forward, and place food within their left visual field.", "as": "කුෂන් මඟින් ඉරියව්ව සකසා, ආහාර ඔවුන්ගේ වම් දෘශ්‍ය ක්ෂේත්‍රය තුළ තැබීම.", "p": 150, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 138, "qe": "Managing Laundry and Hygiene: When handling laundry contaminated with blood or body fluids, what infection control measure must be taken?", "qs": "රෙදි සේදීම සහ සනීපාරක්ෂාව: රුධිරයෙන් හෝ ශරීර තරලවලින් දූෂිත වූ රෙදි හැසිරවීමේදී ගත යුතු ආසාදන පාලන පියවර කුමක්ද?", "ae": "Soak and wash the contaminated items separately from regular clothing using a disinfectant or chlorine bleach.", "as": "විෂබීජ නාශකයක් හෝ ක්ලෝරීන් භාවිත කරමින් අපවිත්‍ර වූ ඇඳුම් වෙනම සේදීම.", "p": 204, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 139, "qe": "International Classification of Functioning (ICF): What is the primary purpose and philosophy behind the ICF framework in caregiving?", "qs": "ICF රාමුව: සත්කාර සේවා තුළ ICF රාමුව පිටුපස ඇති මූලික අරමුණ සහ දර්ශනය කුමක්ද?", "ae": "To understand a person's health state holistically by focusing on their strengths, activities, and participation rather than just disabilities.", "as": "ආබාධිත භාවයට පමණක් සීමා නොවී පුද්ගලයෙකුගේ ශක්තීන් සහ ක්‍රියාකාරකම් මත පදනම්ව සෞඛ්‍ය තත්ත්වය අවබෝධ කර ගැනීම.", "p": 83, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 140, "qe": "Communication with Aphasia Patients: Which communication technique is most effective when speaking with a care recipient who has expressive aphasia?", "qs": "אפාසියා රෝගීන් සමඟ සන්නිවේදනය: ප්‍රකාශන אפාසියා (Expressive aphasia) ඇති සේවාලාභියෙකු සමඟ කතා කිරීමේදී වඩාත්ම ඵලදායී සන්නිවේදන ක්‍රමය කුමක්ද?", "ae": "Speak slowly in short sentences, utilize gestures or picture boards, and ask simple yes-or-no questions.", "as": "සෙමින් කෙටි වාක්‍යවලින් කතා කිරීම, අභිනයන් හෝ පින්තූර පුවරු භාවිත කිරීම සහ සරල ඔව්/නැත ප්‍රශ්න ඇසීම.", "p": 115, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 141, "qe": "Ethics of Caregiving Staff: Which action represents a fundamental breach of professional caregiving ethics?", "qs": "සත්කාරක කාර්ය මණ්ඩලයේ සදාචාරය: වෘත්තීය සාත්තු සේවා සදාචාරයේ මූලික කඩකිරීමක් නිරූපණය කරන්නේ කුමන ක්‍රියාවෙන්ද?", "ae": "Sharing private health details or personal photos of a care recipient on social media without authorization.", "as": "අවසරයකින් තොරව සේවාලාභියෙකුගේ පුද්ගලික සෞඛ්‍ය තොරතුරු හෝ ඡායාරූප සමාජ මාධ්‍යවල බෙදා ගැනීම.", "p": 19, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 142, "qe": "Japanese Care Services Framework: Under the Japanese Long-Term Care Insurance system, what is the distinction between institutional and home-based services?", "qs": "ජපන් සත්කාර සේවා රාමුව: ජපානයේ දිගු කාලීන සත්කාර රක්ෂණ ක්‍රමය යටතේ ආයතනික සහ නිවාස පාදක සේවා අතර වෙනස කුමක්ද?", "ae": "Institutional services provide 24-hour facility care (like nursing homes), while home-based services provide short-term visits or day-use care at home.", "as": "ආයතනික සේවා පැය 24 පුරා පහසුකම් සපයන අතර, නිවාස පාදක සේවා කෙටිකාලීන චාරිකා හෝ දිවා සේවා සපයයි.", "p": 25, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 143, "qe": "Body Mechanics: To prevent lower back injuries when moving a care recipient, what should a care worker avoid doing with their torso?", "qs": "ශරීර යාන්ත්‍ර විද්‍යාව: සේවාලාභියෙකු මාරු කිරීමේදී පහළ පිටේ තුවාල වළක්වා ගැනීමට සත්කාරකයා තම ශරීරයෙන් වැළකී සිටිය යුත්තේ කුමක්ද?", "ae": "Avoid twisting the spine while holding weight: instead, pivot by moving the feet to change direction.", "as": "බර දරාගෙන සිටින විට කොඳු ඇට පෙළ ඇඹරීමෙන් වළකින්න; ඒ වෙනුවට පාද මාරු කරමින් දිශාව වෙනස් කරන්න.", "p": 41, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 144, "qe": "Body Mechanics: How should a care worker adjust their posture to maximize stability when lifting a heavy object or assisting a user?", "qs": "ශරීර යාන්ත්‍ර විද්‍යාව: බර වස්තුවක් එසවීමේදී හෝ පරිශීලකයෙකුට උදව් කිරීමේදී ස්ථායීතාවය උපරිම කර ගැනීමට සත්කාරකයා ඉරියව් සකස් කරගත යුත්තේ කෙසේද?", "ae": "Widen the base of support by spreading the feet apart and lowering the center of gravity by bending the knees.", "as": "පාද ඈත් කර ආධාරක පදනම පුළුල් කර දණහිස් නැමීමෙන් ගුරුත්වාකර්ෂණ කේන්ද්‍රය පහත හෙළීම.", "p": 38, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "BODY_MECHANICS", "ic": "🏋️"}, {"id": 145, "qe": "Standard Precautions: What is the fundamental principle of \"Standard Precautions\" in infection prevention?", "qs": "සම්මත පූර්වාරක්ෂාවන්: ආසාදන වැළැක්වීමේදී \"සම්මත පූර්වාරක්ෂාවන්\" හි මූලික ප්‍රතිපත්තිය කුමක්ද?", "ae": "To treat all blood, body fluids, secretions, and non-intact skin as potentially infectious, regardless of the person's diagnosis.", "as": "සියලුම රුධිරය, ශරීර තරල සහ බිඳී ගිය සම ආසාදිත විය හැකි යැයි සලකා කටයුතු කිරීම.", "p": 32, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 146, "qe": "Homeostasis: What is the biological function known as homeostasis in the human body?", "qs": "හෝමියෝස්ටේසිස්: මිනිස් සිරුරේ හෝමියෝස්ටේසිස් ලෙස හැඳින්වෙන ජීව විද්‍යාත්මක ක්‍රියාකාරිත්වය කුමක්ද?", "ae": "The internal regulatory system that maintains stable, balanced conditions such as body temperature and fluid levels.", "as": "ශරීර උෂ්ණත්වය සහ තරල මට්ටම වැනි ස්ථාවර තත්ත්වයන් පවත්වා ගන්නා අභ්‍යන්තර නියාමන පද්ධතියයි.", "p": 49, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 147, "qe": "Anatomy of the Spine: What natural anatomical shape does a healthy human vertebral column (spine) form when viewed from the side?", "qs": "කොඳු ඇට පෙළේ ව්‍යුහ විද්‍යාව: පැත්තකින් බලන විට නිරෝගී මිනිස් කොඳු ඇට පෙළක් සාදන ස්වභාවික ව්‍යුහ විද්‍යාත්මක හැඩය කුමක්ද?", "ae": "An S-shaped curve that acts as a natural shock absorber for the body.", "as": "ශරීරයට ස්වභාවික කම්පන අවශෝෂකයක් ලෙස ක්‍රියා කරන S හැඩැති වක්‍රයකි.", "p": 59, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 148, "qe": "Bone Fractures: Which bone is most commonly fractured during a fall in elderly individuals with osteoporosis, often leading to bedridden states?", "qs": "අස්ථි බිඳීම්: ඔස්ටියෝපොරෝසිස් ඇති වැඩිහිටියන් වැටීමේදී බහුලව බිඳෙන සහ ඇඳටම වැටීමට හේතු වන අස්ථිය කුමක්ද?", "ae": "The femoral neck (thigh bone at the hip joint).", "as": "කලවා අස්ථි ග්‍රීවය (Femoral neck).", "p": 82, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 149, "qe": "Gastrointestinal Physiology: In which part of the human digestive system is water primarily absorbed and solid feces formed?", "qs": "ආමාශයික කායික විද්‍යාව: මිනිස් ආහාර ජීර්ණ පද්ධතියේ ජලය ප්‍රධාන වශයෙන් අවශෝෂණය කර ඝන මලපහ සෑදෙන කොටස කුමක්ද?", "ae": "The large intestine (colon).", "as": "මහ බඩවැල (Large intestine).", "p": 65, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 150, "qe": "Preventing Dehydration: What proactive measure should care workers take to prevent dehydration in elderly care recipients?", "qs": "විජලනය වැළැක්වීම: වැඩිහිටි සේවාලාභීන්ගේ විජලනය වැළැක්වීමට සත්කාරකයන් ගත යුතු ක්‍රියාමාර්ගය කුමක්ද?", "ae": "Offer small amounts of fluids regularly throughout the day, even if the recipient does not explicitly express thirst.", "as": "පිපාසය නොදැනුණත්, දවස පුරා නිතිපතා කුඩා තරල ප්‍රමාණයක් ලබා දීම.", "p": 74, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 151, "qe": "Purpose of Oral Care: Beyond maintaining clean teeth, what is a critical medical reason for performing regular oral care in frail elderly individuals?", "qs": "මුඛ සත්කාරවල අරමුණ: දුර්වල වැඩිහිටියන්ගේ නිතිපතා මුඛ සත්කාර කිරීමේ තීරණාත්මක වෛද්‍ය හේතුව කුමක්ද?", "ae": "To reduce bacteria in the mouth, thereby preventing aspiration pneumonia.", "as": "මුඛයේ බැක්ටීරියා අඩු කිරීම මඟින් අපේක්ෂණ නියුමෝනියාව වැළැක්වීම.", "p": 185, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 152, "qe": "Aspiration Pneumonia: What causes aspiration pneumonia to develop in vulnerable care recipients?", "qs": "අපේක්ෂණ නියුමෝනියාව: අවදානමට ලක්විය හැකි සේවාලාභීන් තුළ අපේක්ෂණ නියුමෝනියාව ඇති වීමට හේතුව කුමක්ද?", "ae": "Food, liquids, or oral secretions accidentally entering the trachea and lungs instead of the esophagus.", "as": "ආහාර, දියර හෝ මුඛ ශ්‍රාවයන් අහම්බෙන් ශ්වාසනාලයට සහ පෙනහළුවලට ඇතුළු වීම.", "p": 80, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 153, "qe": "Empathetic Communication: If a care recipient expresses deep sadness about losing their independence, which response demonstrates true empathy?", "qs": "සහනුභූතික සන්නිවේදනය: සේවාලාභියෙකු තම ස්වාධීනත්වය අහිමි වීම ගැන දැඩි දුකක් ප්‍රකාශ කරන්නේ නම්, සැබෑ සහනුභූතිය පෙන්වන ප්‍රතිචාරය කුමක්ද?", "ae": "\"It sounds like you are feeling really sad and frustrated about these changes right now.\"", "as": "\"මෙම වෙනස්කම් ගැන ඔබට දැන් සැබවින්ම දුකක් සහ කලකිරීමක් දැනෙන බව පෙනේ.\"", "p": 104, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 154, "qe": "The Care Plan Process: What is the purpose of formulating a formalized \"Care Plan\" within the caregiving process?", "qs": "සත්කාර සැලැස්ම් ක්‍රියාවලිය: සාත්තු සේවා ක්‍රියාවලිය තුළ විධිමත් \"සත්කාර සැලැස්මක්\" සකස් කිරීමේ අරමුණ කුමක්ද?", "ae": "To establish clear, customized goals and standardized care strategies based on the specific needs of the care recipient.", "as": "සේවාලාභියාගේ විශේෂිත අවශ්‍යතා මත පදනම්ව පැහැදිලි අරමුණු සහ සත්කාර උපාය මාර්ග ස්ථාපිත කිරීම.", "p": 26, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 155, "qe": "Oxygen Therapy Safety: What critical safety rule must be enforced in a room where a care recipient is utilizing an oxygen concentrator or cylinder?", "qs": "ඔක්සිජන් ප්‍රතිකාර ආරක්ෂාව: ඔක්සිජන් සිලින්ඩරයක් භාවිත කරන කාමරයක ක්‍රියාත්මක කළ යුතු තීරණාත්මක ආරක්ෂක නීතිය කුමක්ද?", "ae": "Strictly prohibit open flames, smoking, or sparking equipment within the vicinity, as oxygen supports rapid combustion.", "as": "ඔක්සිජන් ඉක්මනින් දැල්වීමට උපකාරී වන බැවින් විවෘත ගින්දර, දුම්පානය දැඩි ලෙස තහනම් කිරීම.", "p": 89, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 156, "qe": "Cleaning and Environment: When organizing and cleaning a care recipient's room, what is essential for cognitive safety and comfort?", "qs": "පිරිසිදු කිරීම සහ පරිසරය: සේවාලාභියෙකුගේ කාමරය පිරිසිදු කිරීමේදී සංජානන ආරක්ෂාව සහ සුවපහසුව සඳහා අත්‍යවශ්‍ය වන්නේ කුමක්ද?", "ae": "Always return personal items, mobility aids, and furniture to their original, familiar positions after cleaning.", "as": "පිරිසිදු කිරීමෙන් පසු පුද්ගලික ද්‍රව්‍ය සහ ගෘහ භාණ්ඩ මුල් තිබූ ස්ථානවලටම නැවත තැබීම.", "p": 203, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 157, "qe": "Care Recording Principles: Which rule must be followed when documenting care notes in a professional medical/caregiving record?", "qs": "සත්කාර වාර්තා කිරීමේ නීති: වෘත්තීය වෛද්‍ය හෝ සාත්තු සේවා වාර්තාවක සත්කාර සටහන් තැබීමේදී අනුගමනය කළ යුතු නීතිය කුමක්ද?", "ae": "Record observations objectively, accurately, and immediately after the event, stating facts rather than personal assumptions.", "as": "පෞද්ගලික අනුමානවලින් තොරව, වෛෂයිකව, නිවැරදිව සහ සිදුවීමෙන් පසු වහාම සටහන් කිරීම.", "p": 118, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 158, "qe": "Transfer Assist Equipment: What mechanical device should be utilized to safely move a completely immobile care recipient from a bed to a chair?", "qs": "මාරු කිරීමේ ආධාරක උපකරණ: චලනය වීමට නොහැකි සේවාලාභියෙකු ඇඳේ සිට පුටුවකට ආරක්ෂිතව මාරු කිරීමට භාවිත කළ යුතු යාන්ත්‍රික උපකරණය කුමක්ද?", "ae": "A mechanical patient lift (hoist) equipped with a secure fabric sling.", "as": "යාන්ත්‍රික රෝගී එසවුම් යන්ත්‍රයක් (Mechanical patient lift / Hoist).", "p": 131, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 159, "qe": "Posture During Meals: To ensure safe swallowing during a meal, how should a care recipient seated in a chair be positioned?", "qs": "ආහාර ගැනීමේදී ඉරියව්: පුටුවක වාඩි වී සිටින සේවාලාභියෙකුට ආරක්ෂිතව ගිලීම තහවුරු කිරීමට වාඩි විය යුත්තේ කෙසේද?", "ae": "Sit upright with the chin pulled slightly down, knees bent at 90 degrees, and feet resting flat on the floor.", "as": "නිකට මඳක් පහළට නමා, දණහිස් අංශක 90 ට නමා, පාද බිම තබා කෙළින් වාඩි වීම.", "p": 149, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 160, "qe": "Posture During Defecation: Which bodily posture anatomically facilitates easier bowel movements on a toilet or commode?", "qs": "මලපහ කිරීමේදී ඉරියව්: වැසිකිළියකදී මලපහ කිරීම ශරීරයට පහසු කරන ඉරියව්ව කුමක්ද?", "ae": "Leaning the upper body slightly forward while keeping the feet planted firmly on the floor.", "as": "පාද බිම තබා උඩුකය මඳක් ඉදිරියට නැමීම.", "p": 158, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 161, "qe": "Stress Urinary Incontinence: What causes stress urinary incontinence to occur in elderly individuals?", "qs": "පීඩන ආතති මුත්‍රා අසංයමය: වැඩිහිටියන් තුළ පීඩන ආතති මුත්‍රා අසංයමය ඇති වීමට හේතුව කුමක්ද?", "ae": "Involuntary leaking of urine caused by sudden abdominal pressure from coughing, sneezing, or lifting things, due to weakened pelvic floor muscles.", "as": "දුර්වල වූ ශ්‍රෝණි තට්ටුවේ මාංශ පේශි නිසා කැස්ස, කිවිසුම් යාම හෝ බර ඉසිලීමේදී මුත්‍රා කාන්දු වීම.", "p": 161, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "STRESS_INCONTINENCE", "ic": "💧"}, {"id": 162, "qe": "Physiological Effects of Bathing: What are the physical benefits of full-body warm water bathing for an elderly care recipient?", "qs": "ස්නානය කිරීමේ කායික බලපෑම්: වැඩිහිටියෙකු උණුසුම් ජලයෙන් සම්පූර්ණ ශරීරය සේදීමෙන් ලැබෙන කායික ප්‍රතිලාභ මොනවාද?", "ae": "It improves blood circulation, relaxes muscles, eases joint pain, promotes sleep, and cleanses the skin.", "as": "රුධිර සංසරණය වැඩි දියුණු කරයි, මාංශ පේශි ලිහිල් කරයි, සන්ධි වේදනාව අඩු කරයි සහ සම පිරිසිදු කරයි.", "p": 189, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 163, "qe": "Face Washing Assistance: When assisting a care recipient with washing their face, which movement pattern should the care worker use?", "qs": "මුහුණු සේදීමේ සහය: සේවාලාභියෙකුට මුහුණු සේදීමට උදව් කිරීමේදී සත්කාරකයා භාවිත කළ යුතු චලන රටාව කුමක්ද?", "ae": "Wipe gently from the inner corner of the eye toward the outer corner to prevent spreading infections.", "as": "ආසාදන පැතිරීම වැළැක්වීම සඳහා ඇසේ අභ්‍යන්තර කෙළවරේ සිට පිටත කෙළවරට මෘදු ලෙස පිස දැමීම.", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 164, "qe": "Shaving Precautions: What safety precaution is paramount when using a razor to shave a male care recipient's beard?", "qs": "රැවුල කැපීමේ පූර්වාරක්ෂාවන්: පිරිමි සේවාලාභියෙකුගේ රැවුල කැපීමට රේසරයක් භාවිත කිරීමේදී වැදගත්ම ආරක්ෂක පියවර කුමක්ද?", "ae": "Stretch the skin tight with one hand while shaving in the direction of hair growth, taking extra care if the recipient takes blood-thinning medication.", "as": "එක් අතකින් සම තද කරමින්, රෝම වැඩෙන දිශාවට රැවුල කැපීම.", "p": 184, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 165, "qe": "Safety During Nail Clipping: Why must care workers be extremely cautious when cutting the toenails of a care recipient with diabetes?", "qs": "නියපොතු කැපීමේ ආරක්ෂාව: දියවැඩියාව ඇති සේවාලාභියෙකුගේ පාදයේ නියපොතු කපන විට සත්කාරකයන් ඉතා ප්‍රවේශම් විය යුත්තේ ඇයි?", "ae": "Minor cuts or skin nicks can easily develop into severe, slow-healing ulcers or deep infections due to poor circulation.", "as": "දුර්වල රුධිර සංසරණය නිසා කුඩා කැපුමක් වුවද බරපතල තුවාලයක් හෝ ආසාදනයක් බවට පත්විය හැකි බැවිනි.", "p": 184, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 166, "qe": "Oral Hygiene Techniques: When assisting a user with teeth brushing, where should the cleaning process begin to evaluate comfort?", "qs": "මුඛ සනීපාරක්ෂක ක්‍රම: දත් මදින විට සේවාලාභියාගේ සුවපහසුව තක්සේරු කිරීමට පිරිසිදු කිරීම ආරම්භ කළ යුත්තේ කොතැනින්ද?", "ae": "Start brushing from the front teeth or exterior surfaces, moving gradually to the sensitive back areas.", "as": "ඉදිරි දත්වලින් හෝ බාහිර පෘෂ්ඨවලින් බුරුසු ගෑම ආරම්භ කර සංවේදී පසුපස ප්‍රදේශවලට ගමන් කිරීම.", "p": 185, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 167, "qe": "Functions of the Skin: What is a primary physiological function of human skin besides serving as a barrier to pathogens?", "qs": "සමේ ක්‍රියාකාරිත්වය: රෝග කාරකවලට එරෙහි බාධකයක් ලෙස සේවය කිරීමට අමතරව මිනිස් සමේ ඇති ප්‍රධාන කායික කාර්යය කුමක්ද?", "ae": "Regulating body temperature through blood vessel changes and sweating.", "as": "රුධිර වාහිනී වෙනස්වීම් සහ දහඩිය දැමීම හරහා ශරීර උෂ්ණත්වය නියාමනය කිරීම.", "p": 190, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 168, "qe": "Bed Bath: When performing a bed bath for a care recipient, how should the extremities be wiped to promote blood return?", "qs": "ඇඳ නාන: සේවාලාභියෙකුට ඇඳ නානක් ලබා දීමේදී රුධිර සංසරණය ප්‍රවර්ධනය කිරීමට අන්ත (අත්/පාද) පිස දැමිය යුත්තේ කෙසේද?", "ae": "Wipe the arms and legs starting from the distal end (hands/feet) moving toward the proximal end (shoulder/hip).", "as": "දෑත් සහ කකුල් දුරස්ථ අන්තයේ සිට සමීප අන්තය දෙසට පිස දැමීම.", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 169, "qe": "Perineal Care: What is the correct direction to wipe when performing perineal hygiene for a female care recipient?", "qs": "පෙරිනියල් සත්කාර: කාන්තා සේවාලාභිනියකට පෙරිනියල් සනීපාරක්ෂාව සිදු කිරීමේදී පිස දැමිය යුතු නිවැරදි දිශාව කුමක්ද?", "ae": "Always wipe from the front to the back (from the urethra toward the anus) to prevent urinary tract infections.", "as": "මුත්‍රා මාර්ගයේ සිට ගුදය දෙසට (ඉදිරිපස සිට පසුපසට) පිස දැමීම.", "p": 198, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 170, "qe": "Quality of Life (QOL): How is the concept of \"Quality of Life\" maximized within elder caregiving?", "qs": "ජීවන තත්ත්වය (QOL): වැඩිහිටි සත්කාර තුළ \"ජීවන තත්ත්ව\" සංකල්පය උපරිම කරන්නේ කෙසේද?", "ae": "By respecting the recipient's personal choices, values, and autonomy, allowing them to live meaningfully according to their own preferences.", "as": "සේවාලාභියාගේ පුද්ගලික තේරීම්, අගයන් සහ ස්වයං පාලනයට ගරු කිරීම මඟින්.", "p": 14, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 171, "qe": "Adult Day Care Services: What primary benefit do daytime facility services (Adult Day Care) offer to family caregivers?", "qs": "වැඩිහිටි දිවා සුරැකුම් සේවා: දිවා කාලයේ ආයතනික සේවා (Adult Day Care) මඟින් පවුලේ සත්කාරකයන්ට ලැබෙන ප්‍රධාන ප්‍රතිලාභය කුමක්ද?", "ae": "Providing respite care to reduce the physical and mental burden on family members who take care of them at home.", "as": "පවුලේ රැකබලා ගන්නන්ට ඇති ශාරීරික හා මානසික බර අඩු කර ගැනීම සඳහා විවේක සත්කාර ලබා දීම.", "p": 25, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 172, "qe": "The Caregiving Process Cycle: What are the four main sequential steps of the professional caregiving cycle?", "qs": "සත්කාර ක්‍රියාවලි චක්‍රය: වෘත්තීය සාත්තු සේවා චක්‍රයේ ප්‍රධාන අනුක්‍‍‍‍රමික පියවර හතර කුමක්ද?", "ae": "Assessment, Planning, Implementation, and Evaluation.", "as": "තක්සේරු කිරීම, සැලසුම් කිරීම, ක්‍රියාත්මක කිරීම සහ ඇගයීම.", "p": 26, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 173, "qe": "Walking Assistance with a Cane: When a care recipient with right-sided paralysis walks using a quad cane, where should the care worker stand?", "qs": "වේවැලකින් ඇවිදීමේ සහය: දකුණු පස අංශභාගය ඇති සේවාලාභියෙකු ක්වාඩ් කේන් එකක් භාවිතයෙන් ඇවිදින විට සත්කාරකයා සිටිය යුත්තේ කොතැනද?", "ae": "Stand slightly behind the care recipient on their right side (the affected side) to provide immediate support if they fall.", "as": "වැටුණහොත් ක්ෂණික සහයෝගයක් ලබා දීමට සේවාලාභියාගේ දකුණු පැත්තෙන් (පීඩාවට පත් පැත්තෙන්) මඳක් පිටුපසින් සිටීම.", "p": 137, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 174, "qe": "Biological Aging (Senescence): What defines the physiological process of aging in humans?", "qs": "ජීව විද්‍යාත්මක වයසට යාම: මිනිසුන්ගේ වයසට යාමේ කායික ක්‍රියාවලිය නිර්වචනය කරන්නේ කුමන කරුණෙන්ද?", "ae": "A progressive, universal decline in functional reserves and organ efficiency over time, increasing vulnerability to disease.", "as": "කාලයත් සමඟ ක්‍රියාකාරී සංචිතවල සහ අවයවවල කාර්යක්ෂමතාවයේ ක්‍රමික ක්ෂය වීම.", "p": 71, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 175, "qe": "Disuse Syndrome: What secondary complications can develop rapidly when an elderly person undergoes prolonged, complete bed rest?", "qs": "භාවිත නොකිරීමේ සින්ඩ්‍රෝමය: වැඩිහිටියෙකු දිගුකාලීනව පූර්ණ ඇඳ විවේකයක සිටින විට ඉක්මනින් වර්ධනය විය හැකි ද්විතියික සංකූලතා මොනවාද?", "ae": "Muscle atrophy, joint stiffening (contractures), deep vein thrombosis, and pressure ulcers.", "as": "මාංශ පේශි ක්ෂය වීම, සන්ධි තද වීම, ගැඹුරු නහර thrombosis සහ තදබද තුවාල.", "p": 129, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 176, "qe": "Which term represents the person's daily living and that of their life?", "qs": "පුද්ගලයාගේ එදිනෙදා ජීවිතය සහ ජීවිතයේ පැවැත්ම නිරූපණය කරන පදය කුමක්ද?", "ae": "QOL (Quality of Life) / A person's daily living and that of his/her life.", "as": "QOL (ජීවන තත්ත්වය / පුද්ගලයාගේ එදිනෙදා ජීවිතය සහ පැවැත්ම).", "p": 14, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 177, "qe": "What is the concept that allows people with disabilities to live a normal life in society?", "qs": "ආබාධිත තත්ත්වයක් තිබුණද සමාජයේ සාමාන්‍ය ජීවිතයක් ගත කිරීමට ඉඩ සලසන සංකල්පය කුමක්ද?", "ae": "Normalization / Concept of people with disabilities living normally.", "as": "නෝමලයිසේෂන් (Normalization / ආබාධිත අය සඳහාද සාමාන්‍ය පරිදි ජීවත් වීමේ අයිතිය).", "p": 15, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 178, "qe": "What is the most important consideration during bathing or excretion care?", "qs": "ස්නානය හෝ මලපහ/මුත්‍රා කිරීමේ සත්කාරවලදී වඩාත්ම සැලකිලිමත් විය යුත්තේ කුමක් ගැනද?", "ae": "Consideration for privacy / Covering the body to protect privacy.", "as": "පුද්ගලිකත්වය (Privacy) ආරක්ෂා කිරීම සහ සිරුර ආවරණය කර ගෞරවය රැකීම.", "p": 19, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 179, "qe": "What is the act of using a belt to tie a user to a bed to keep them from standing up called?", "qs": "සේවාලාභියා නැඟී සිටීම වැළැක්වීමට පටියකින් ඇඳට බන්ධනය කිරීමේ ක්‍රියාව හැඳින්වෙන්නේ කුමක් ලෙසද?", "ae": "Physical restraint / Using a belt to keep the user from standing or moving.", "as": "ශාරීරික තහනම් කිරීම (Physical restraint / පටියකින් ඇඳට බන්ධනය කිරීම).", "p": 20, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 180, "qe": "What is the term for providing assistance to persons who need long-term care?", "qs": "දිගුකාලීන සත්කාර අවශ්‍ය පුද්ගලයින්ට සහය වීම හැඳින්වෙන පදය කුමක්ද?", "ae": "Care services.", "as": "සාත්තු සේවා (Care services).", "p": 25, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 181, "qe": "What is the first step in the Care Process?", "qs": "සාත්තු සේවා ක්‍රියාවලියේ පළමු අදියර වන්නේ කුමක්ද?", "ae": "Assessment / Information collection and analysis.", "as": "තක්සේරු කිරීම (Assessment / තොරතුරු රැස් කිරීම සහ විශ්ලේෂණය).", "p": 26, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 182, "qe": "What are elderly people with low immunity easily affected by?", "qs": "ප්‍රතිශක්තිය අඩු වයෝවෘද්ධ පුද්ගලයන් වඩාත් ඉක්මනින් ගොදුරු වන්නේ කුමන තත්ත්වයටද?", "ae": "Infectious diseases / High risk of contracting infectious diseases.", "as": "ආසාදන රෝග (Infectious diseases).", "p": 30, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 183, "qe": "What principle is used to reduce the burden on the caregiver's lower back?", "qs": "සත්කාරකයාගේ පහළ පිටට (ඉණට) යන බර අඩු කර ගැනීමට භාවිත කරන මූලධර්මය කුමක්ද?", "ae": "Use the principle of leverage.", "as": "උත්තෝලක මූල ධර්මය / ලීවර් න්‍යාය භාවිතය (Principle of leverage).", "p": 41, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 184, "qe": "What mechanism maintains a constant internal body environment despite external changes?", "qs": "බාහිර පරිසරයේ වෙනස්වීම් හමුවේ ශරීරයේ අභ්‍යන්තර සමතුලිතතාවය පවත්වා ගන්නා යාන්ත්‍රණය කුමක්ද?", "ae": "Homeostasis.", "as": "හෝමියෝස්ටේසිස් (Homeostasis / අභ්‍යන්තර සමතුලිතතාවය).", "p": 49, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 185, "qe": "What is the state of sleep where the brain is resting and deep sleep occurs?", "qs": "මොළය විවේක සුවයෙන් පසුවන සහ තද නින්ද ඇති වන නින්දේ අවස්ථාව කුමක්ද?", "ae": "Non-REM Sleep.", "as": "නොන්-රෙමි නින්ද (Non-REM Sleep).", "p": 69, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 186, "qe": "Which part of the body should be massaged to prevent constipation?", "qs": "මලබද්ධය වළක්වා ගැනීම සඳහා ශරීරයේ කුමන ප්‍රදේශයක් සම්බාහනය කළ යුතුද?", "ae": "Abdomen / Massage the abdomen.", "as": "උදරය (Abdomen / බඩ ප්‍රදේශය සම්බාහනය කිරීම).", "p": 75, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 187, "qe": "Which part of the thigh bone is most prone to fractures in elderly people?", "qs": "වැඩිහිටියන්ගේ කලවා අස්ථියේ වැඩිපුරම අස්ථි බිඳීම් සිදු වන ප්‍රදේශය කුමක්ද?", "ae": "Femoral neck.", "as": "කලවා අස්ථි ග්‍රීවය (Femoral neck).", "p": 82, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 188, "qe": "What caregiving attitude involves understanding and staying close to the user's feelings?", "qs": "සේවාලාභියාගේ හැඟීම් තේරුම් ගෙන සංවේදීව කටයුතු කිරීමේ සත්කාරක ආකල්පය කුමක්ද?", "ae": "Be empathetic / Empathy.", "as": "සහනුභූතිය / අනුකම්පාව සහ සංවේදී බව (Empathy).", "p": 104, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 189, "qe": "What is the abbreviation used for basic Activities of Daily Living?", "qs": "එදිනෙදා ජීවිතයේ මූලික ක්‍රියාකාරකම් සඳහා භාවිත කරන කෙටි යෙදුම කුමක්ද?", "ae": "ADL (Activities of Daily Living).", "as": "ADL (එදිනෙදා ජීවන ක්‍රියාකාරකම්).", "p": 124, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 190, "qe": "What skin trouble develops when remaining in the same posture for a long time?", "qs": "බොහෝ වේලාවක් එකම ඉරියව්වෙන් සිටීම නිසා ඇතිවන සමේ ගැටළුව කුමක්ද?", "ae": "Pressure ulcer (Bedsore).", "as": "තදබද තුවාල (Pressure ulcer / Bedsores).", "p": 130, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 191, "qe": "What is the name of the wheelchair component where the user rests their feet?", "qs": "රෝද පුටුවේ සේවාලාභියාගේ පාද තබන කොටස හඳුන්වන නම කුමක්ද?", "ae": "Foot support (Footrest).", "as": "පාද තබන පුවරුව (Foot support / Footrest).", "p": 139, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 192, "qe": "Which wheelchair part do you step on to tilt the wheelchair back when overcoming a step?", "qs": "පඩියක් උඩින් යාමට රෝද පුටුව පසුපසට ඇල කිරීමට පාදයෙන් පාගන කොටස කුමක්ද?", "ae": "Tipping bar.", "as": "ටිපින් බාර් (Tipping bar).", "p": 139, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 193, "qe": "Which main part of the wheelchair is located near the brake assembly?", "qs": "රෝද පුටුවේ තිරිංග එකලස් කිරීම අසල පිහිටි ප්‍රධාන කොටස කුමක්ද?", "ae": "Drive wheel / Main wheel.", "as": "ප්‍රධාන රෝදය (Drive wheel / Main wheel).", "p": 139, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 194, "qe": "What is the stage called when food passes through the pharynx during swallowing?", "qs": "ආහාර ගිලීමේදී ආහාරය ග්‍රසනිකාව (Pharynx) හරහා ගමන් කරන අවධිය හඳුන්වන්නේ කුමක් ලෙසද?", "ae": "Pharyngeal stage.", "as": "ග්‍රසනිකා අවධිය (Pharyngeal stage).", "p": 148, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 195, "qe": "What is the safest posture during mealtimes to prevent choking or aspiration?", "qs": "හුස්ම හිරවීම හෝ අපේක්ෂාව වැළැක්වීම සඳහා ආහාර ගැනීමේදී ආරක්ෂිතම ඉරියව්ව කුමක්ද?", "ae": "Posture with the chin pulled down (Slightly forward-tilted chin posture).", "as": "නිකට පහතට නමාගත් ඉරියව්ව (Forward-tilted chin posture).", "p": 149, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 196, "qe": "When assisting a meal for a user with hemiplegia, from which side should food be served?", "qs": "අංශභාගය ඇති පරිශීලකයෙකුට ආහාර ලබා දීමේදී කටේ කුමන පැත්තෙන් ලබාදිය යුතුද?", "ae": "Diagonally from the healthy (unaffected) side.", "as": "නිරෝගී පැත්තෙන් (Diagonally from healthy side).", "p": 153, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 197, "qe": "Which method is used to explain food placement on a table to a visually impaired user?", "qs": "දෘශ්‍යාබාධිත පරිශීලකයෙකුට මේසය මත ආහාර පිහිටීම පැහැදිලි කිරීමට භාවිත කරන ක්‍රමය කුමක්ද?", "ae": "Clock positions.", "as": "ඔරලෝසු කටු පිහිටීම (Clock positions).", "p": 154, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "CLOCK_POSITION", "ic": "🕒"}, {"id": 198, "qe": "Which posture makes defecation easiest and most natural?", "qs": "මල පහ කිරීමේදී මල පිටවීම වඩාත්ම පහසු සහ ස්වභාවික කරන ඉරියව්ව කුමක්ද?", "ae": "Forward-leaning posture.", "as": "ඉදිරියට තරමක් නැමුණු ඉරියව්ව (Forward-leaning posture).", "p": 158, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 199, "qe": "What is the condition where urine leaks when abdominal pressure increases (e.g., coughing)?", "qs": "කැස්ස වැනි අවස්ථාවලදී උදරීය පීඩනය වැඩි වන විට මුත්‍රා කාන්දු වීමේ තත්ත්වය කුමක්ද?", "ae": "Stress urinary incontinence.", "as": "පීඩන ආතති මුත්‍රා අසංයමය (Stress urinary incontinence).", "p": 161, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "STRESS_INCONTINENCE", "ic": "💧"}, {"id": 200, "qe": "What is most important when providing grooming care to a user?", "qs": "පරිශීලකයෙකුට පෞද්ගලික පිරිසිදුකම සහ බාහිර පෙනුම සැපයීමේදී වඩාත්ම වැදගත් වන්නේ කුමක්ද?", "ae": "Matching the person's habits and personal preferences.", "as": "එම පුද්ගලයාගේ දෛනික පුරුදු සහ මනාපයන්ට ගැලපෙන ලෙස සිදු කිරීම.", "p": 174, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 201, "qe": "Which part of the face should be wiped first during face washing care?", "qs": "මුහුණ සේදීමේදී ප්‍රථමයෙන්ම පිරිසිදු කළ යුතු මුහුණේ කොටස කුමක්ද?", "ae": "Eyes (Wiping from the inner corner to the outer corner).", "as": "ඇස් (ඇසේ ඇතුළු කෙළවරේ සිට පිටත කෙළවරට සේදීම).", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 202, "qe": "How should removable dentures be stored when not in use overnight?", "qs": "රාත්‍රී කාලයේ භාවිත නොකරන විට ගැලවිය හැකි කෘතිම දත් ඇන්ද (Dentures) ගබඩා කළ යුත්තේ කෙසේද?", "ae": "Immerse and store in a container filled with water.", "as": "වතුර පිරවූ බඳුනක ගිල්වා සංරක්ෂණය කිරීම.", "p": 187, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 203, "qe": "Which part of the body is most prone to becoming dirty/soiled?", "qs": "ශරීරයේ වඩාත්ම අපිරිසිදු වීමට නැඹුරු වන ප්‍රදේශය කුමක්ද?", "ae": "Genital area (Perineal area).", "as": "ජනනෙන්ද්‍රිය ප්‍රදේශය (Perineal area).", "p": 190, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 204, "qe": "When entering a bathtub, which side should a user with paralysis step in with first?", "qs": "ආබාධිත තත්ත්වයක් ඇති පරිශීලකයෙකු නාන තටාකයට ඇතුළු වීමේදී පළමුව තැබිය යුත්තේ කුමන පැත්තද?", "ae": "Enter from the healthy (unaffected) side first.", "as": "නිරෝගී පැත්ත පළමුව තබා ඇතුළු වීම.", "p": 194, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 205, "qe": "Which part of the hand/fingers should be used when washing the scalp/hair during hair care?", "qs": "හිසකෙස් සේදීමේදී හිස්කබල පිරිසිදු කිරීමට අතේ/ඇඟිලිවල කුමන කොටස භාවිත කළ යුතුද?", "ae": "Wash using the pads of the fingers.", "as": "ඇඟිලි තුඩුවල මෘදු කොටසින් (Pads of fingers) පිරිසිදු කිරීම.", "p": 196, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 206, "qe": "What is the first step to do when providing meal preparation / cooking assistance?", "qs": "ආහාර පිසීමේ සහය ලබා දීමේදී ප්‍රථමයෙන්ම කළ යුතු පියවර කුමක්ද?", "ae": "Decide the menu.", "as": "ආහාර වට්ටෝරුව / මෙනුව තීරණය කිරීම (Decide the menu).", "p": 202, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 207, "qe": "How should a care worker adjust their posture to maximize stability and prevent strain when lifting a heavy weight?", "qs": "බර වස්තුවක් එසවීමේදී ස්ථායීතාවය වැඩි කර ගැනීමට සහ ආතතිය වැළැක්වීමට සත්කාරකයා තම ඉරියව් සකස් කරගත යුත්තේ කෙසේද?", "ae": "Expand the base of support by widening the stance and lowering the center of gravity.", "as": "පාද පුළුල් කර ආධාරක පදනම වැඩි කර ගුරුත්වාකර්ෂණ කේන්ද්‍රය පහත හෙළීම.", "p": 38, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "BODY_MECHANICS", "ic": "🏋️"}, {"id": 208, "qe": "What non-pharmacological abdominal massage technique can a care worker perform to stimulate bowel movements?", "qs": "මලපහ කිරීම උත්තේජනය කිරීම සඳහා සත්කාරකයාට කළ හැකි ඖෂධ නොවන උදර සම්බාහන ක්‍රමය කුමක්ද?", "ae": "Massage the abdomen in a clockwise direction following the anatomical path of the large intestine (the shape of the hiragana character \"の\").", "as": "මහ බඩවැලේ දිශාවට දක්ෂිණාවර්තව උදරය සම්බාහනය කිරීම (\"の\" හැඩයට).", "p": 75, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "CLOCK_POSITION", "ic": "🕒"}, {"id": 209, "qe": "Which of the following physical measurements is entirely excluded from baseline clinical vital signs?", "qs": "මූලික සායනික ජීව සංඥාවලින් සම්පූර්ණයෙන්ම බැහැර කර ඇති භෞතික මිනුම කුමක්ද?", "ae": "The care recipient's general physical build or body constitution (Taikaku).", "as": "සේවාලාභියාගේ ශරීර ස්වභාවය හෝ ශාරීරික ගොඩනැගීම (Taikaku).", "p": 49, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 210, "qe": "When initiating a bath for a care recipient with hemiplegia, which action constitutes a dangerous procedural error?", "qs": "අංශභාගය ඇති සේවාලාභියෙකුට ස්නානය ආරම්භ කිරීමේදී සිදු කරන බරපතල ක්‍රියා පටිපාටි දෝෂය කුමක්ද?", "ae": "Pouring warm water onto the paralyzed (affected) side of the body first before checking thermal sensation.", "as": "උෂ්ණත්වය පරීක්ෂා නොකර අංශභාගය ඇති පැත්තට උණු වතුර වැටීමට සැලැස්වීම.", "p": 194, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 211, "qe": "Which grooming task is most effectively performed immediately following a bath because the tissue is softened?", "qs": "පටක මෘදු වී ඇති බැවින් ස්නානය කළ වහාම ඉතා ඵලදායී ලෙස කළ හැකි පෞද්ගලික සත්කාරක කාර්යය කුමක්ද?", "ae": "Trimming the care recipient's fingernails and toenails.", "as": "නියපොතු කැපීම (නියපොතු මෘදු වී ඇති බැවින්).", "p": 184, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 212, "qe": "How should a care worker handle general household laundry duties inside an integrated group living environment?", "qs": "ඒකාබද්ධ කණ්ඩායම් ජීවන පරිසරයක් තුළ සාමාන්‍ය ගෘහස්ථ රෙදි සේදීමේ කටයුතු සත්කාරකයා විසින් හැසිරවිය යුත්තේ කෙසේද?", "ae": "Adhere strictly to the established sanitation, sorting, and washing rules of the facility.", "as": "ආයතනයේ ස්ථාපිත සනීපාරක්ෂක සහ වර්ග කිරීමේ නීති දැඩි ලෙස පිළිපැදීම.", "p": 204, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 213, "qe": "Why must a care worker guide a manual wheelchair backward when moving down a steep slope?", "qs": "බෑවුමකින් පහළට රෝද පුටුවක් ගෙන යන විට සත්කාරකයා එය පසුපසට හරවා ගෙන යා යුත්තේ ඇයි?", "ae": "To prevent the occupant from slipping forward or falling completely out of the wheelchair seat.", "as": "සේවාලාභියා ඉදිරියට ලිස්සා යාම හෝ රෝද පුටුවෙන් වැටීම වැළැක්වීම සඳහා.", "p": 145, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 214, "qe": "What contextual factors must a care worker consider to maintain professional standards when discussing care updates?", "qs": "සත්කාර යාවත්කාලීන කිරීම් සාකච්ඡා කිරීමේදී වෘත්තීය ප්‍රමිතීන් පවත්වා ගැනීමට සත්කාරකයා සැලකිලිමත් විය යුතු සන්දර්භගත සාධක මොනවාද?", "ae": "Carefully select an appropriate time and private location to avoid accidental eavesdropping or data leakage.", "as": "තොරතුරු හෙළිවීම වැළැක්වීම සඳහා සුදුසු වේලාවක් සහ පුද්ගලික ස්ථානයක් තෝරා ගැනීම.", "p": 120, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 215, "qe": "Within the standardized ICF framework, which personal attribute is viewed as a separate contextual factor rather than a direct component of core structural functioning?", "qs": "ප්‍රමිතිගත ICF රාමුව තුළ, මූලික ව්‍යුහ ක්‍රියාකාරිත්වයේ සෘජු සංරචකයක් ලෙස නොව වෙනම සන්දර්භගත සාධකයක් ලෙස සලකන පුද්ගල ගුණාංගය කුමක්ද?", "ae": "An individual's unique character traits or core personality traits (Kojin no seikaku).", "as": "පුද්ගලයෙකුගේ පෞද්ගලික චරිත ලක්ෂණ හෝ පෞරුෂ ස්වභාවය.", "p": 83, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 216, "qe": "What medical term describes involuntary urine leakage triggered by a sudden increase in intra-abdominal pressure during coughing or laughing?", "qs": "කැස්ස හෝ සිනාසීමේදී උදරීය පීඩනය ඉහළ යාම නිසා අහම්බෙන් මුත්‍‍රා කාන්දු වීම විස්තර කරන වෛද්‍ය පදය කුමක්ද?", "ae": "Stress urinary incontinence, resulting from weakened pelvic floor muscles.", "as": "පීඩන ආතති මුත්‍රා අසංයමය (Stress urinary incontinence).", "p": 161, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "STRESS_INCONTINENCE", "ic": "💧"}, {"id": 217, "qe": "What structural curve does a normal human spine exhibit to distribute mechanical load and absorb walking shocks?", "qs": "යාන්ත්‍රික බර බෙදා හැරීමට සහ ඇවිදීමේ කම්පන අවශෝෂණය කර ගැනීමට නිරෝගී මිනිස් කොඳු ඇට පෙළක ඇති ව්‍යුහගත වක්‍රය කුමක්ද?", "ae": "An S-shaped lateral curvature (S-ji wankyoku).", "as": "S හැඩැති වක්‍රයක් (S-shaped curve).", "p": 59, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 218, "qe": "What core philosophy dictates that individuals with physical or cognitive disabilities should live standard lives integrated into community settings?", "qs": "ශාරීරික හෝ සංජානන ආබාධ සහිත පුද්ගලයින් සමාජ පරිසරයන් තුළ සාමාන්‍ය ජීවිතයක් ගත කළ යුතු යැයි නියම කරන මූලික දර්ශනය කුමක්ද?", "ae": "The principle of Normalization.", "as": "නෝමලයිසේෂන් මූලධර්මය (Principle of Normalization).", "p": 15, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 219, "qe": "When helping a vulnerable care recipient walk down a flight of stairs, where should the care worker stand?", "qs": "අවදානමට ලක්විය හැකි සේවාලාභියෙකුට පඩිපෙළින් බැසීමට උදව් කිරීමේදී සත්කාරකයා සිටිය යුත්තේ කොතැනද?", "ae": "Stand securely on the steps directly below the care recipient to act as a physical barrier in case of a slip.", "as": "ලිස්සා යාමකදී ආරක්ෂිත බාධකයක් ලෙස ක්‍රියා කිරීමට සේවාලාභියාට පහළ පියගැටපෙළේ සිටීම.", "p": 138, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 220, "qe": "What specialized substance must be used to thoroughly sanitize and clean removable dental prosthetics?", "qs": "ගැලවිය හැකි කෘතිම දත් පිරිසිදු කර විෂබීජහරණය කිරීමට භාවිත කළ යුතු විශේෂ ද්‍රව්‍යය කුමක්ද?", "ae": "A designated chemical denture cleanser solution (Senjouzai).", "as": "කෘතිම දත් පිරිසිදු කරන විශේෂ රසායනික ද්‍රාවණයක් (Denture cleanser solution).", "p": 187, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 221, "qe": "What is the fundamental scientific purpose of utilizing the International Classification of Functioning, Disability and Health (ICF)?", "qs": "ජාත්‍යන්තර ක්‍රියාකාරීත්ව, ආබාධිත සහ සෞඛ්‍ය වර්ගීකරණය (ICF) භාවිත කිරීමේ මූලික විද්‍යාත්මක අරමුණ කුමක්ද?", "ae": "To provide a comprehensive, multi-dimensional classification of health, functioning, and daily living capabilities.", "as": "සෞඛ්‍යය, ක්‍රියාකාරීත්වය සහ දෛනික ජීවන හැකියාවන් බහු-මාන ලෙස වර්ගීකරණය කිරීම.", "p": 83, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 222, "qe": "What foundational rule guides a caregiver when helping a client with one-sided paralysis change clothes?", "qs": "එක් පැත්තක අංශභාගය ඇති සේවාලාභියෙකුට ඇඳුම් මාරු කිරීමට උදව් කිරීමේදී සත්කාරකයාට මඟ පෙන්වන මූලික නීතිය කුමක්ද?", "ae": "\"Dress the affected side first, undress the unaffected side first.\"", "as": "\"පීඩාවට පත් පැත්ත පළමුව ඇඳගන්න, නිරෝගී පැත්ත පළමුව ගලවන්න\".", "p": 176, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "DRESSING_RULE", "ic": "👕"}, {"id": 223, "qe": "What is the correct physiological path of food ingestion through the stages of swallowing?", "qs": "ආහාර ගිලීමේ අවධීන් හරහා ආහාර අභ්‍යන්තරයට ඇතුල් වීමේ නිවැරදි කායික මාර්ගය කුමක්ද?", "ae": "Anticipatory phase → Preparatory phase → Oral phase → Pharyngeal phase → Esophageal phase.", "as": "අපේක්ෂිත අවධිය → සූදානම් කිරීමේ අවධිය → මුඛ අවධිය → ග්‍රසනිකා අවධිය → అన్నනාල අවධිය.", "p": 148, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 224, "qe": "What is the correct mechanical sequence for a resident with hemiplegia climbing up stairs using a quad cane?", "qs": "ක්වාඩ් කේන් එකක් භාවිතයෙන් අංශභාගය ඇති සේවාලාභියෙකු පඩිපෙළ නගින විට අනුගමනය කළ යුතු නිවැරදි යාන්ත්‍රික අනුපිළිවෙළ කුමක්ද?", "ae": "Advance the cane first, step up with the unaffected (strong) leg, and then bring up the affected (paralyzed) leg.", "as": "වේවැල ඉදිරියට තබන්න, නිරෝගී කකුලින් නඟින්න, පසුව පීඩාවට පත් කකුල ඉහළට ගෙන එන්න.", "p": 138, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "STAIRS_CANE", "ic": "🦯"}, {"id": 225, "qe": "When conducting a bed bath, which area should be cleansed thoroughly immediately after finishing the upper extremities?", "qs": "ඇඳ නානක් සිදු කරන විට, ඉහළ අන්ත අවසන් කළ වහාම හොඳින් පිරිසිදු කළ යුතු ප්‍රදේශය කුමක්ද?", "ae": "The resident's back and posterior torso.", "as": "සේවාලාභියාගේ පිටුපස සහ පසුපස ශරීර කොටස.", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 226, "qe": "Which muscular action violates body mechanics principles and increases risk of caregiver back injury?", "qs": "ශරීර යාන්ත්‍ර විද්‍යා මූලධර්ම උල්ලංඝනය කරන සහ සත්කාරකයාගේ පිටේ තුවාල වීමේ අවදානම වැඩි කරන මාංශ පේශි ක්‍රියාව කුමක්ද?", "ae": "Relying primarily on small local muscle groups (like the lower back or wrists) instead of large leg muscles.", "as": "විශාල කකුල් මාංශ පේශි වෙනුවට කුඩා පහළ පිටේ මාංශ පේශි මත පමණක් රඳා පැවතීම.", "p": 41, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 227, "qe": "What is the precise order for removing and replacing trousers for a client with right-sided hemiplegia?", "qs": "දකුණු පස අංශභාගය ඇති සේවාලාභියෙකුට කලිසම් ගැලවීමේ සහ ඇඳීමේ නිවැරදි අනුපිළිවෙළ කුමක්ද?", "ae": "Put the trousers on the right leg (affected) first, and pull them off the left leg (unaffected) first.", "as": "දකුණු කකුලට (පීඩාවට පත්) පළමුව කලිසම ඇඳීම සහ වම් කකුලෙන් (නිරෝගී) පළමුව ගැලවීම.", "p": 178, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 228, "qe": "What physical adaptation must a care worker make to establish a reassuring and non-threatening connection before speaking?", "qs": "කතා කිරීමට පෙර සනසවන සහ තර්ජනාත්මක නොවන සම්බන්ධතාවයක් ඇති කර ගැනීමට සත්කාරකයා කළ යුතු භෞතික වෙනස්කම කුමක්ද?", "ae": "Lower your physical height to match the care recipient's eye level exactly.", "as": "සේවාලාභියාගේ ඇස් මට්ටමට ඔබේ උස පහත් කිරීම.", "p": 108, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 229, "qe": "Which alternative communication tool is highly effective when delivering complex instructions to a literate client with severe hearing loss?", "qs": "දැඩි ශ්‍රවන ආබාධයක් ඇති සාක්ෂරතාවය ඇති සේවාලාභියෙකුට සංකීර්ණ උපදෙස් ලබා දීමේදී වඩාත්ම ඵලදායී විකල්ප සන්නිවේදන මෙවලම කුමක්ද?", "ae": "Utilizing written communication sheets or message boards (Hitsudan).", "as": "ලිඛිත සන්නිවේදන පත්‍රිකා හෝ පුවරු භාවිත කිරීම (Hitsudan).", "p": 114, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 230, "qe": "How is the core concept of Quality of Life (QOL) defined within customized long-term care plans?", "qs": "අභිරුචිකරණය කළ දිගුකාලීන සත්කාර සැලසුම් තුළ ජීවන තත්ත්ව (QOL) මූලික සංකල්පය නිර්වචනය කරන්නේ කෙසේද?", "ae": "The degree of individual satisfaction, comfort, and fulfillment a person experiences regarding their daily living choices.", "as": "පුද්ගලයෙකුගේ දෛනික ජීවන තේරීම් සම්බන්ධයෙන් අත්විඳින තෘප්තිය සහ සුවපහසුව.", "p": 14, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 231, "qe": "What safety hazard must a care worker monitor closely when drying an elderly resident's hair after a bath?", "qs": "ස්නානය කිරීමෙන් පසු වැඩිහිටි සේවාලාභියෙකුගේ හිසකෙස් වියළීමේදී සත්කාරකයා දැඩි ලෙස නිරීක්ෂණය කළ යුතු ආරක්ෂක උවදුර කුමක්ද?", "ae": "Prevent thermal skin burns (Yakedo) by keeping the appliance moving and avoiding direct heat application on thin skin.", "as": "අධික උණුසුම නිසා සම පිලිස්සීම (Yakedo) වැළැක්වීම.", "p": 196, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 232, "qe": "Which set of actions represents basic physiological self-care tasks classified as Activities of Daily Living (ADL)?", "qs": "එදිනෙදා ජීවන ක්‍රියාකාරකම් (ADL) ලෙස වර්ගීකරණය කර ඇති මූලික කායික ස්වයං-සත්කාරක කාර්යයන් නිරූපණය කරන ක්‍රියා මාලාව කුමක්ද?", "ae": "Essential survival actions including eating, bathing, dressing, and primary indoor mobility.", "as": "කෑම කෑම, ස්නානය, ඇඳුම් ඇඳීම සහ මූලික ගමන් කිරීම වැනි අත්‍යවශ්‍ය ක්‍රියාකාරකම්.", "p": 124, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 233, "qe": "Which complex domestic chore serves as a standard example of an Instrumental Activity of Daily Living (IADL)?", "qs": "උපකරණගත දෛනික ජීවන ක්‍රියාකාරකමකට (IADL) සම්මත උදාහරණයක් ලෙස සේවය කරන සංකීර්ණ ගෘහස්ථ වැඩය කුමක්ද?", "ae": "Performing household laundry tasks, managing personal finances, or grocery shopping.", "as": "ගෘහස්ථ රෙදි සේදීම, මූල්‍ය කළමනාකරණය හෝ සිල්ලර බඩු මිලදී ගැනීම.", "p": 201, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 234, "qe": "When assisting a resident with left-sided hemiplegia to remove a sweater, which side must be taken off first?", "qs": "වම් පස අංශභාගය ඇති සේවාලාභියෙකුට ස්වීටර් එකක් ගැලවීමට උදව් කිරීමේදී පළමුව ඉවත් කළ යුත්තේ කුමන පැත්තද?", "ae": "Slide the garment off the right arm (the unaffected, healthy side) first.", "as": "දකුණු අතෙන් (නිරෝගී පැත්තෙන්) පළමුව ඇඳුම ගැලවීම.", "p": 176, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 235, "qe": "To prevent cognitive confusion and accidental falls after cleaning a resident's living environment, where should items be placed?", "qs": "සේවාලාභියාගේ ජීවන පරිසරය පිරිසිදු කිරීමෙන් පසු සංජානන ව්‍යාකූලත්වය සහ අහම්බෙන් ඇද වැටීම් වැළැක්වීමට භාණ්ඩ තැබිය යුත්තේ කොතැනද?", "ae": "Always return furniture, mobility aids, and personal items back to their exact original locations.", "as": "ගෘහ භාණ්ඩ සහ පුද්ගලික ද්‍රව්‍ය මුල් තිබූ ස්ථානවලටම නැවත තැබීම.", "p": 203, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 236, "qe": "Which mechanical tool should be provided to assist a bedridden male client with independent bladder elimination?", "qs": "ඇඳටම වී සිටින පිරිමි සේවාලාභියෙකුට ස්වාධීනව මුත්‍රා බැහැර කිරීමට උදව් කිරීමට සැපයිය යුතු යාන්ත්‍රික මෙවලම කුමක්ද?", "ae": "A portable, anatomically shaped male urinal bottle (Shounyouki).", "as": "පුරුෂයින් සඳහා වන ජංගම මුත්‍රා බෝතලයක් (Urinal).", "p": 160, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 237, "qe": "Which technique helps a care recipient with receptive aphasia who has difficulty understanding spoken language?", "qs": "කතා කරන භාෂාව තේරුම් ගැනීමට අපහසු ග්‍රාහක אפාසියා (Receptive aphasia) ඇති සේවාලාභියෙකුට උපකාරී වන තාක්ෂණය කුමක්ද?", "ae": "Use clear, expressive physical gestures, icons, and direct visual cues to accompany your words.", "as": "පැහැදිලි ශාරීරික අභිනයන් සහ දෘශ්‍ය ඉඟි භාවිත කිරීම.", "p": 115, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 238, "qe": "At what average volume of fluid retention within the bladder wall does the human body initiate the primary neural urge to urinate?", "qs": "මුත්‍රාශය තුළ තරල රඳවා තබා ගැනීමේ සාමාන්‍ය පරිමාව කොපමණ වූ විට මිනිස් සිරුර මුත්‍රා කිරීමේ මූලික ස්නායු ඉල්ලීම ආරම්භ කරයිද?", "ae": "Approximately 200 milliliters of urine accumulation.", "as": "දළ වශයෙන් මිලිලීටර් 200 ක මුත්‍රා ප්‍රමාණයක් එකතු වූ විට.", "p": 156, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 239, "qe": "What method should a caregiver use to describe food positions on a meal tray to a care recipient with total visual impairment?", "qs": "සම්පූර්ණයෙන්ම දෘශ්‍යාබාධිත සේවාලාභියෙකුට ආහාර තැටියක ආහාරවල පිහිටීම විස්තර කිරීමට සත්කාරකයා භාවිත කළ යුතු ක්‍රමය කුමක්ද?", "ae": "The Clock Position method, comparing the circular tray setup to the numbers on an analog clock face.", "as": "ඔරලෝසු කටු ක්‍රමය (Clock Position).", "p": 154, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "CLOCK_POSITION", "ic": "🕒"}, {"id": 240, "qe": "What clinical intervention is required to prevent ischemic tissue necrosis (pressure ulcers) in a bedridden resident?", "qs": "ඇඳටම වී සිටින සේවාලාභියෙකු තුළ ඉස්මීකි පටක නෙක්‍රෝසිස් (තදබද තුවාල) වැළැක්වීමට අවශ්‍ය සායනික මැදිහත්වීම කුමක්ද?", "ae": "Execute systematic body position changes (Taii henkan) at least once every two hours.", "as": "සෑම පැය දෙකකට වරක්වත් ක්‍රමානුකූලව ඉරියව් වෙනස් කිරීම (Taii henkan).", "p": 130, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 241, "qe": "What is the correct method for removing contaminated disposable examination gloves after a care task?", "qs": "සත්කාරක කාර්යයකින් පසු දූෂිත බැහැර කළ හැකි පරීක්ෂණ අත්වැසුම් ඉවත් කිරීමේ නිවැරදි ක්‍රමය කුමක්ද?", "ae": "Peel the glove off inside-out from the wrist cuff to capture all biological waste inside the inverted surface.", "as": "මැණික් කටුව ප්‍රදේශයෙන් ඇතුළට හරවා අත්වැසුම් ගැලවීම.", "p": 33, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 242, "qe": "Which region contains a high density of apocrine sweat glands and requires thorough cleansing during regular hygiene routines?", "qs": "ඇපොක්‍රීන් දහඩිය ග්‍රන්ථි ඝන ලෙස අඩංගු වන සහ සාමාන්‍ය සනීපාරක්ෂක චර්යාවන්හිදී හොඳින් පිරිසිදු කළ යුතු ප්‍රදේශය කුමක්ද?", "ae": "The axillary regions (armpits) and the anogenital areas.", "as": "කිහිලි සහ ජනනෙන්ද්‍රිය ප්‍රදේශය.", "p": 190, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 243, "qe": "When wiping a care recipient's face during morning hygiene care, which region should be wiped last because it accumulates more sweat and skin debris?", "qs": "උදෑසන සනීපාරක්ෂක සත්කාරයේදී සේවාලාභියාගේ මුහුණ පිස දැමීමේදී, වැඩිපුර දහඩිය සහ සමේ අපද්‍රව්‍ය එකතු වන නිසා අවසානයට පිස දැමිය යුත්තේ කුමන ප්‍රදේශයද?", "ae": "The neck region (Kubi).", "as": "බෙල්ලේ ප්‍රදේශය (Kubi).", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 244, "qe": "What is the proper physical technique for a care worker guiding an individual with severe visual impairment during ambulation?", "qs": "දැඩි දෘශ්‍යාබාධයක් ඇති පුද්ගලයෙකු ඇවිදීමේදී මඟ පෙන්වන සත්කාරකයාගේ නිවැරදි භෞතික තාක්ෂණය කුමක්ද?", "ae": "Stand slightly ahead and allow them to lightly touch or grasp your elbow or forearm for direction.", "as": "ඉදිරියෙන් සිටිමින් ඔබේ වැලමිටෙන් හෝ අතින් අල්ලා ගැනීමට ඉඩ සැලසීම.", "p": 112, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 245, "qe": "What is the correct anatomical coverage required when wearing a standard surgical face mask for infection control?", "qs": "ආසාදන පාලනය සඳහා සම්මත ශල්‍ය මුහුණු ආවරණයක් (Mask) පැළඳීමේදී අවශ්‍ය වන නිවැරදි ව්‍යුහ විද්‍යාත්මක ආවරණය කුමක්ද?", "ae": "Secure the mask so it fully covers both the nose and the chin simultaneously.", "as": "නාසය සහ නිකට යන දෙකම සම්පූර්ණයෙන්ම ආවරණය වන පරිදි මස්කස් එක පැළඳීම.", "p": 33, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 246, "qe": "What clinical term describes the complete loss of voluntary neural control over bladder elimination, resulting in accidental leakage?", "qs": "මුත්‍රා බැහැර කිරීමේ ස්වේච්ඡා ස්නායු පාලනය සම්පූර්ණයෙන්ම අහිමි වීමෙන් අහම්බෙන් කාන්දු වීම විස්තර කරන සායනික පදය කුමක්ද?", "ae": "Urinary Incontinence (Shikkis / Incontinence).", "as": "මුත්‍රා අසංයමය (Incontinence / Shikkis).", "p": 161, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 247, "qe": "What is the correct structural order of the professional caregiving methodology cycle?", "qs": "වෘත්තීය සාත්තු සේවා ක්‍රමවේද චක්‍රයේ නිවැරදි ව්‍යුහගත අනුපිළිවෙළ කුමක්ද?", "ae": "Assessment → Planning → Implementation → Evaluation.", "as": "තක්සේරු කිරීම → සැලසුම් කිරීම → ක්‍රියාත්මක කිරීම → ඇගයීම.", "p": 26, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 248, "qe": "What dual operational settings are funded under Japan's national Long-Term Care Insurance framework to support older adults?", "qs": "වැඩිහිටියන්ට සහය වීම සඳහා ජපානයේ ජාතික දිගු කාලීන සත්කාර රක්ෂණ රාමුව යටතේ අරමුදල් සපයන ද්විත්ව මෙහෙයුම් සැකසුම් මොනවාද?", "ae": "Home-based care services (Jitaku) and institutional facility-based care services (Shisetsu).", "as": "නිවාස පාදක සේවා (Jitaku) සහ ආයතනික සේවා (Shisetsu).", "p": 25, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 249, "qe": "Which anatomical part of the hand is frequently missed during rapid hand washing and requires deliberate friction?", "qs": "ඉක්මනින් දෑත් සේදීමේදී නිතර මඟහැරී යන සහ හිතාමතා ඝර්ෂණය කළ යුතු අතේ ව්‍යුහ විද්‍යාත්මක කොටස කුමක්ද?", "ae": "The interdigital spaces (the skin webbing between the fingers).", "as": "ඇඟිලි අතර ඇති සමේ අවකාශයන් (Interdigital spaces).", "p": 34, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 250, "qe": "What cognitive symptom is commonly observed in individual clients experiencing progressive dementia?", "qs": "ප්‍රගතිශීලී ඩිමෙන්ශියාව අත්විඳින තනි සේවාලාභීන් තුළ බහුලව දක්නට ලැබෙන සංජානන ලක්ෂණය කුමක්ද?", "ae": "A distinct lack of personal awareness or insight regarding their own cognitive lapses and memory deficits (Jikaku ga nai).", "as": "තමන්ගේ මතක දුර්වලතා පිළිබඳව ස්වයං අවබෝධයක් නොමැති වීම (Jikaku ga nai).", "p": 95, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 251, "qe": "Which structural bone is highly vulnerable to breaking during a fall in an elderly individual with progressive osteoporosis?", "qs": "ප්‍රගතිශීලී ඔස්ටියෝපොරෝසිස් ඇති වැඩිහිටියෙකු වැටීමේදී බිඳී යාමට ඉහළ අවදානමක් ඇති ව්‍යුහගත අස්ථිය කුමක්ද?", "ae": "The femoral neck or thigh bone (Daitaikotsu).", "as": "කලවා අස්ථිය හෝ ග්‍රීවය (Femoral neck / Daitaikotsu).", "p": 82, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}];
