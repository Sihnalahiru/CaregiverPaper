<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congratulations Sudu Nona ♥ PWA</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --secondary: #818cf8;
      --accent: #f43f5e;
      --success: #34d399;
      --warning: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }

    .app-shell {
      width: 100%; max-width: 680px; background: var(--card-bg); border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column;
      overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); position: relative;
    }

    header {
      background: #090d16; padding: 14px 16px; text-align: center; border-bottom: 2px solid var(--primary);
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.1rem; color: var(--primary); }
    .sub-header { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .btn-directory {
      background: var(--primary); color: #0f172a; border: none; padding: 8px 14px;
      border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .progress-track { background: #334155; height: 6px; width: 100%; }
    .progress-bar { background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; width: 0%; transition: width 0.3s ease; }

    main { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }

    .jump-bar { display: flex; gap: 8px; }
    .jump-bar input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; color: var(--text); border-radius: 10px; font-size: 0.9rem; }
    .btn-go { background: var(--secondary); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }

    .topic-badge { background: rgba(56, 189, 248, 0.1); border-left: 4px solid var(--primary); padding: 10px 12px; border-radius: 6px; }
    .topic-title { font-size: 0.9rem; font-weight: bold; color: var(--primary); }
    .subtopic-title { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .animation-stage-box {
      background: #090d16; border: 1px solid #334155; border-radius: 16px;
      min-height: 380px; position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    .engine-header {
      background: #111827; padding: 8px 12px; border-bottom: 1px solid #1f2937;
      display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--warning); font-weight: bold;
    }

    .scene-container { flex-grow: 1; position: relative; overflow: hidden; min-height: 340px; }
    .scene {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex;
      flex-direction: column; justify-content: center; align-items: center; padding: 16px;
      text-align: center; opacity: 0; transform: scale(0.95); transition: all 0.4s ease-in-out; pointer-events: none;
    }
    .scene.active { opacity: 1; transform: scale(1); pointer-events: auto; }

    .anim-icon { font-size: 44px; margin-bottom: 8px; }
    .title-large { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .q-text-en { font-size: 0.95rem; color: var(--secondary); font-weight: 600; margin-bottom: 6px; line-height: 1.35; }
    .q-text-si { font-size: 0.88rem; color: var(--text); line-height: 1.4; }

    .answer-step-box { background: #1e293b; border: 1px solid var(--success); padding: 12px; border-radius: 12px; width: 100%; text-align: left; }
    .answer-step-title { color: var(--success); font-weight: bold; font-size: 0.82rem; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .answer-step-text-en { font-size: 0.88rem; color: #f8fafc; font-weight: 600; line-height: 1.35; }
    .answer-step-text-si { font-size: 0.82rem; color: #a7f3d0; margin-top: 4px; line-height: 1.35; }

    .btn-replay { margin-top: 12px; padding: 10px 22px; background: var(--accent); color: white; border: none; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4); }
    .btn-audio { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }

    .nav-controls { display: flex; gap: 10px; margin-top: auto; }
    .btn-nav { flex: 1; padding: 12px; background: #334155; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

    /* DIRECTORY MODAL STYLES */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px); z-index: 1000; display: flex; justify-content: center;
      align-items: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: var(--card-bg); border: 1px solid #334155; border-radius: 20px;
      width: 100%; max-width: 620px; max-height: 85vh; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
    }
    .modal-header { background: #090d16; padding: 14px 18px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 1.05rem; color: var(--primary); }
    .btn-close-modal { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
    .modal-body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-filter { background: #0f172a; border: 1px solid #334155; color: var(--text-muted); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
    .btn-filter.active { background: var(--primary); color: #0f172a; font-weight: bold; border-color: var(--primary); }

    .dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 8px; }
    .dir-item {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px 4px;
      text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .dir-item:hover, .dir-item.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); transform: translateY(-2px); }
    .dir-item .q-num { font-size: 0.82rem; font-weight: bold; color: var(--primary); }
    .dir-item .q-pg { font-size: 0.65rem; color: var(--text-muted); }

    @keyframes pulseGlow { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }
    .anim-pulse { animation: pulseGlow 2s infinite ease-in-out; transform-origin: center; }
  </style>
</head>
<body>

<div class="app-shell">
  <header>
    <div>
      <h1>Congratulations Sudu Nona ♥ PWA</h1>
      <div class="sub-header" id="q-status-text">Question 1 / 251</div>
    </div>
    <button class="btn-directory" onclick="toggleDirectoryModal()">
      📖 නාමාවලිය
    </button>
  </header>

  <div class="progress-track">
    <div class="progress-bar" id="p-bar"></div>
  </div>

  <main>
    <div class="jump-bar">
      <input type="number" id="jump-input" placeholder="Quick Jump (1 - 251)" min="1" max="251">
      <button class="btn-go" onclick="jumpToInput()">Go</button>
    </div>

    <div class="topic-badge">
      <div class="topic-title" id="main-topic"></div>
      <div class="subtopic-title" id="sub-topic"></div>
    </div>

    <div class="animation-stage-box">
      <div class="engine-header">
        <span id="engine-status">⚙️ ANSWER ANIMATION ENGINE</span>
        <button class="btn-audio" onclick="speakCurrentQuestion()" title="Listen Pronunciation">🔊</button>
      </div>

      <div class="scene-container">
        <div class="scene active" id="scene1">
          <div class="anim-icon" id="s1-icon">💧</div>
          <div class="title-large" id="s1-title">Care Procedure Concept</div>
          <div style="color: var(--text-muted); font-size: 0.85rem;" id="s1-sub">Scene 1: Answer Key Demonstration</div>
        </div>

        <div class="scene" id="scene2">
          <div style="font-size: 24px; margin-bottom: 6px;">❓</div>
          <div class="q-text-en" id="s2-en"></div>
          <div class="q-text-si" id="s2-si"></div>
        </div>

        <div class="scene" id="scene3">
          <div id="s3-svg-holder"></div>
          <div class="answer-step-box" style="margin-top: 6px;">
            <div class="answer-step-title">
              <span>🎯 ANSWER PROCEDURE / ක්‍රියාමාර්ගය:</span>
            </div>
            <div class="answer-step-text-en" id="s3-ans-en"></div>
            <div class="answer-step-text-si" id="s3-ans-si"></div>
          </div>
        </div>

        <div class="scene" id="scene4">
          <div style="font-size: 28px;">🧠</div>
          <div style="font-size: 0.95rem; color: var(--primary); font-weight: bold; margin-top: 6px;">මතක පරීක්ෂාව (Answer Recall)</div>
          <div style="font-size: 42px; margin: 10px 0; color: var(--accent);" id="quizBox">❓</div>
        </div>

        <div class="scene" id="scene5">
          <div style="font-size: 0.88rem; font-weight: bold; color: var(--success); margin-bottom: 4px;">සම්පූර්ණ නිවැරදි පිළිතුර (Full Answer)</div>
          <div style="font-size: 0.85rem; color: #fff; font-weight: 600; line-height: 1.35;" id="s5-ans-en"></div>
          <div style="font-size: 0.8rem; color: #a7f3d0; margin-top: 4px; line-height: 1.35;" id="s5-ans-si"></div>
          <button class="btn-replay" onclick="startAnimationSequence()">නැවත බලන්න 🔄</button>
        </div>
      </div>
    </div>

    <div class="nav-controls">
      <button class="btn-nav" id="btn-prev" onclick="navigate(-1)">Previous</button>
      <button class="btn-nav" id="btn-next" onclick="navigate(1)">Next</button>
    </div>
  </main>
</div>

<div class="modal-overlay" id="directory-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📖 ප්‍රශ්න නාමාවලිය (Question Directory)</h2>
      <button class="btn-close-modal" onclick="toggleDirectoryModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="text" id="dir-search" placeholder="Search Q# or Keyword..." onkeyup="filterDirectory()" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 10px; font-size: 0.85rem;">
      
      <div class="filter-bar">
        <button class="btn-filter active" onclick="setDirectoryFilter('ALL', this)">All (251)</button>
        <button class="btn-filter" onclick="setDirectoryFilter('BODY_MECH', this)">Body Mech</button>
        <button class="btn-filter" onclick="setDirectoryFilter('MOBILITY', this)">Mobility</button>
        <button class="btn-filter" onclick="setDirectoryFilter('MEAL', this)">Meal Care</button>
        <button class="btn-filter" onclick="setDirectoryFilter('EXCRETION', this)">Excretion</button>
        <button class="btn-filter" onclick="setDirectoryFilter('DRESSING', this)">Dressing</button>
        <button class="btn-filter" onclick="setDirectoryFilter('BATHING', this)">Bathing</button>
        <button class="btn-filter" onclick="setDirectoryFilter('VITAL', this)">Vital/Health</button>
        <button class="btn-filter" onclick="setDirectoryFilter('DEMENTIA', this)">Dementia</button>
      </div>

      <div class="dir-grid" id="dir-grid-container"></div>
    </div>
  </div>
</div>

": "ANSWER_GENERIC", "ic": "💡"}, {"id": 4, "qe": "When writing professional caregiving reports, what framework should be used to ensure the information is clear, structured, and objective?", "qs": "වෘත්තීය සාත්තු සේවා වාර්තා ලිවීමේදී තොරතුරු පැහැදිලි, ව්‍යුහගත සහ වෛෂයික බව තහවුරු කර ගැනීමට කුමන ක්‍රමවේදය භාවිත කළ යුතුද?", "ae": "The 5W1H method, which specifies Who, What, Where, When, Why, and How the event occurred.", "as": "5W1H ක්‍රමය - සිදුවීම සිදුවූයේ කවුද, කුමක්ද, කොතැනද, කවදාද, ඇයි සහ කෙසේද යන්න සඳහන් කිරීම.", "p": 119, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 5, "qe": "What is the core guiding principle behind providing daily life care under modern long-term care philosophies?", "qs": "නවීන දිගුකාලීන සත්කාර දර්ශන යටතේ දෛනික ජීවිත සත්කාර සැපයීමේ මූලික මාර්ගෝපදේශක මූලධර්මය කුමක්ද?", "ae": "Supporting self-reliance by encouraging care recipients to do tasks themselves and assisting only with what they cannot physically perform.", "as": "සේවාලාභීන්ට තනිවම වැඩ කිරීමට දිරිගැන්වීමෙන් සහ ඔවුන්ට ශාරීරිකව කළ නොහැකි දේට පමණක් උදව් කිරීමෙන් ස්වයං-පෝෂිතභාවයට (Independence) සහය වීම.", "p": 15, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 6, "qe": "When performing a full-body bed bath (partial bath or wiping) for a bedridden care recipient, what is the correct hygienic sequence?", "qs": "ඇඳටම වී සිටින සේවාලාභියෙකුට සම්පූර්ණ ශරීරය ඇඳ මත සේදීමේදී (Bed bath) අනුගමනය කළ යුතු නිවැරදි සනීපාරක්ෂක අනුපිළිවෙළ කුමක්ද?", "ae": "Face → Arms → Chest → Abdomen → Legs → Back → Perineal (private) area.", "as": "මුහුණ → දෑත් → පපුව → උදරය → කකුල් → පිටුපස → ජනනෙන්ද්‍රිය ප්‍රදේශය.", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "BED_BATH_SEQUENCE", "ic": "🧼"}, {"id": 7, "qe": "What are the physiological and psychological benefits of warm water tub bathing for an older adult?", "qs": "වැඩිහිටියෙකු උණුසුම් ජල නාන තටාකයක ස්නානය කිරීමෙන් ලැබෙන කායික හා මානසික ප්‍රතිලාභ මොනවාද?", "ae": "It improves peripheral blood circulation, relieves muscle stiffness, promotes mental relaxation, and cleanses the skin.", "as": "එය ව්‍යුහගත රුධිර සංසරණය වැඩි දියුණු කරයි, මාංශ පේශි තද බව මගහරවයි, මානසික විවේකය ප්‍රවර්ධනය කරයි සහ සම පිරිසිදු කරයි.", "p": 189, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 8, "qe": "When assisting a care recipient with right-sided hemiplegia to undress, which side of the clothing should be removed first?", "qs": "දකුණු පස අංශභාගය ඇති සේවාලාභියෙකුගේ ඇඳුම් ඉවත් කිරීමට උදව් කිරීමේදී, ඇඳුමේ කුමන පැත්ත පළමුව ඉවත් කළ යුතුද?", "ae": "Always remove the clothing from the left side (unaffected/healthy side) first.", "as": "සෑම විටම වම් පැත්තෙන් (නිරෝගී/හානි නොවූ පැත්තෙන්) පළමුව ඇඳුම ඉවත් කරන්න.", "p": 176, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 9, "qe": "Which action fulfills the ethical obligation regarding a care recipient's right to privacy?", "qs": "සේවාලාභියෙකුගේ පෞද්ගලිකත්වයට ඇති අයිතිය සම්බන්ධයෙන් සදාචාරාත්මක වගකීම ඉටු කරන්නේ කුමන ක්‍රියාවෙන්ද?", "ae": "Maintaining strict confidentiality by protecting their personal data and medical history from unauthorized individuals.", "as": "අනවසර පුද්ගලයන්ගෙන් ඔවුන්ගේ පුද්ගලික දත්ත සහ වෛද්‍ය ඉතිහාසය ආරක්ෂා කරමින් දැඩි රහස්‍යභාවයක් පවත්වා ගැනීම.", "p": 19, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 10, "qe": "What is the critical first stage of the caregiving process cycle before implementing any physical assistance?", "qs": "කිසියම් භෞතික සහයෝගයක් ලබා දීමට පෙර සාත්තු සේවා ක්‍රියාවලියේ තීරණාත්මක පළමු අදියර කුමක්ද?", "ae": "Assessment, which involves gathering data to clarify the care recipient's current physical condition, desires, and daily needs.", "as": "තක්සේරු කිරීම (Assessment) - සත්කාර ලබන්නාගේ වත්මන් ශාරීරික තත්ත්වය, කැමැත්ත සහ දෛනික අවශ්‍යතා පැහැදිලි කර ගැනීම සඳහා තොරතුරු රැස් කිරීම.", "p": 26, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 11, "qe": "What is the most effective and primary method for care workers to prevent the spread of nosocomial infections within a facility?", "qs": "ආයතනයක් තුළ රෝහල්ගතවීමේ ආසාදන (Nosocomial infections) පැතිරීම වැළැක්වීම සඳහා සත්කාර සේවකයන් අනුගමනය කළ යුතු වඩාත්ම ඵලදායී ක්‍රමය කුමක්ද?", "ae": "Performing thorough hand hygiene with soap and water or alcohol-based sanitizer before and after every client contact.", "as": "සෑම සේවාලාභියෙකු සමඟම සම්බන්ධ වීමට පෙර සහ පසු සබන් සහ ජලයෙන් හෝ මත්පැන් මත පදනම් වූ විෂබීජ නාශකයකින් දෑත් හොඳින් සේදීම.", "p": 34, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 12, "qe": "At approximately what volume of urine accumulation in the bladder does a healthy adult begin to feel a normal sensation or urge to urinate?", "qs": "නිරෝගී වැඩිහිටියෙකුගේ මුත්‍රාශයේ මුත්‍රා කොපමණ ප්‍රමාණයක් එකතු වූ විට සාමාන්‍ය මුත්‍රා කිරීමේ අවශ්‍යතාවය හෝ සංවේදනය දැනීමට පටන් ගනීද?", "ae": "Approximately 200 ml to 300 ml.", "as": "දළ වශයෙන් මිලිලීටර් 200 සිට 300 දක්වා ප්‍රමාණයක්.", "p": 156, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 13, "qe": "What are common underlying causes of bilateral lower extremity edema (swelling) in elderly individuals?", "qs": "වැඩිහිටියන්ගේ පහළ අන්ත දෙකෙහිම ඇතිවන ශෝථය (ඉදිමීම) සඳහා පොදු යටින් පවතින හේතු මොනවාද?", "ae": "Poor blood circulation, prolonged physical inactivity, or underlying cardiac and renal dysfunction.", "as": "දුර්වල රුධිර සංසරණය, දිගුකාලීන ශාරීරික අක්‍රියතාව, හෝ හෘද හා වකුගඩු ආබාධ.", "p": 76, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 14, "qe": "Why are elderly individuals with dysphagia (swallowing difficulties) at a high risk of developing aspiration pneumonia?", "qs": "ගිලීමේ අපහසුතා (Dysphagia) ඇති වැඩිහිටියන් අපේක්ෂණ නියුමෝනියාව (Aspiration pneumonia) වැළඳීමේ අධික අවදානමක සිටින්නේ ඇයි?", "ae": "Because foods, liquids, or oral bacteria accidentally bypass the protective epiglottis and slide directly into the trachea and lungs.", "as": "ආහාර, දියර හෝ මුඛ බැක්ටීරියා අහම්බෙන් ශ්වාසනාලයට සහ පෙනහළුවලට ඇතුළු වන බැවිනි.", "p": 80, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 15, "qe": "Which group of symptoms is highly characteristic of poorly managed diabetes mellitus in older adults?", "qs": "වැඩිහිටියන්ගේ දුර්වල ලෙස පාලනය වන දියවැඩියාව සඳහා ඉතා සුවිශේෂී වන රෝග ලක්ෂණ කාණ්ඩය කුමක්ද?", "ae": "Excessive thirst (polydipsia), frequent urination (polyuria), fatigue, and significantly delayed wound healing.", "as": "අධික පිපාසය, නිතර මුත්‍රා යාම, මහන්සිය සහ තුවාල සුව වීමට πολλක් කල් ගත වීම.", "p": 81, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 16, "qe": "Where is an older adult with severe osteoporosis most likely to sustain a debilitating fracture from a low-impact slip or fall?", "qs": "දැඩි ඔස්ටියෝපොරෝසිස් තත්ත්වය ඇති වැඩිහිටියෙකුට කුඩා ලිස්සා යාමකින් හෝ වැටීමකින් අස්ථි බිඳීමක් සිදුවීමට වැඩි ඉඩක් ඇත්තේ කොතැනද?", "ae": "The femoral neck (the upper portion of the thigh bone near the hip joint).", "as": "කලවා අස්ථි ග්‍රීවය (Femoral neck - උකුල් සන්ධිය අසල කලවා අස්ථියේ ඉහළ කොටස).", "p": 82, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 17, "qe": "If a care recipient expresses intense loneliness or social isolation, how should the care worker respond using active listening?", "qs": "සේවාලාභියෙකු දැඩි පාලුවක් හෝ සමාජීය හුදෙකලාව ප්‍රකාශ කරන්නේ නම්, සත්කාර සේවකයා සක්‍රීය සවන්දීම භාවිතයෙන් ප්‍රතිචාර දැක්විය යුත්තේ කෙසේද?", "ae": "Acknowledge their emotion directly by saying, \"You are feeling quite lonely right now, aren't you? Please tell me more about how you feel.\"", "as": "\"ඔබ දැන් බොහෝ පාලුවෙන් ඉන්නේ, නේද? ඔබේ හැඟීම් ගැන මට තව ටිකක් කියන්න\" ලෙස ඔවුන්ගේ හැඟීම් තේරුම් ගෙන සංවේදී වීම.", "p": 104, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 18, "qe": "Which of the following tasks is classified as an Instrumental Activity of Daily Living (IADL)?", "qs": "පහත සඳහන් කුමන කාර්යය උපකරණගත දෛනික ජීවන ක්‍රියාකාරකමක් (IADL) ලෙස වර්ගීකරණය කර තිබේද?", "ae": "Managing personal finances, preparing meals, shopping for groceries, or using communication devices like telephones.", "as": "මුදල් කළමනාකරණය, ආහාර පිළියෙළ කිරීම, සිල්ලර බඩු මිලදී ගැනීම හෝ දුරකථන භාවිතය.", "p": 124, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 19, "qe": "Under what legal and ethical conditions can physical restraint be temporarily applied to a care recipient?", "qs": "කුමන නීතිමය සහ සදාචාරාත්මක කොන්දේසි යටතේ ශාරීරික සීමා කිරීම් (Physical restraint) තාවකාලිකව යෙදිය හැකිද?", "ae": "Only during extreme emergencies where there is an imminent danger to life, no alternative exists, and it is carefully documented.", "as": "ජීවිතයට ආසන්න අනතුරක් ඇති, වෙනත් විකල්පයක් නොමැති හදිසි අවස්ථාවකදී පමණක් සහ එය නිසි ලෙස වාර්තා කළ යුතුය.", "p": 20, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 20, "qe": "What is the standard protocol for preventing pressure ulcer development in a completely bedridden individual?", "qs": "සම්පූර්ණයෙන්ම ඇඳටම වී සිටින පුද්ගලයෙකුට තදබද තුවාල (Bedsores) ඇතිවීම වැළැක්වීම සඳහා අනුගමනය කළ යුතු ප්‍රමිතිය කුමක්ද?", "ae": "Changing the client's physical position at least once every two hours to relieve prolonged mechanical pressure on bony prominences.", "as": "අස්ථි ප්‍රදේශ මත දිගුකාලීන පීඩනය අවම කිරීම සඳහා සෑම පැය දෙකකට වරක්වත් සේවාලාභියාගේ ඉරියව් වෙනස් කිරීම.", "p": 130, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 21, "qe": "How should a care worker lift a wheelchair over an upward step or curb safely?", "qs": "සත්කාර සේවකයෙකු රෝද පුටුවක් පඩියක් හෝ බාධකයක් උඩින් ආරක්ෂිතව ගෙන යන්නේ කෙසේද?", "ae": "Push down firmly on the rear tipping lever with a foot to elevate the front small casters, then smoothly roll the large rear wheels up.", "as": "පාදයෙන් පිටුපස ටිපින් ලීවරය මත තද කර ඉදිරිපස රෝද ඔසවා, පසුව විශාල පසුපස රෝද ඉහළට රෝල් කිරීම.", "p": 143, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 22, "qe": "When escorting a care recipient who walks independently with a single-ended cane, where should the care worker stand?", "qs": "තනි වේවැලක ආධාරයෙන් ස්වාධීනව ඇවිදින සේවාලාභියෙකු සමඟ යන විට සත්කාර සේවකයා සිටිය යුත්තේ කොතැනද?", "ae": "Stand slightly behind the client on their affected (weaker) side to catch them instantly if they lose balance.", "as": "සමතුලිතතාවය ගිලිහී ගියහොත් වහාම අල්ලා ගැනීමට හැකිවන පරිදි, සේවාලාභියාගේ දුර්වල පැත්තෙන් පිටුපසට වන්නට සිටීම.", "p": 137, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 23, "qe": "When assisting a care recipient with hemiplegia to climb up a flight of stairs, what is the proper sequence of steps?", "qs": "අංශභාගය ඇති සේවාලාභියෙකුට පඩිපෙළ නඟින්න උදව් කිරීමේදී අනුගමනය කළ යුතු නිවැරදි අනුපිළිවෙළ කුමක්ද?", "ae": "Move the cane up first, then step up with the unaffected (strong) leg, and finally bring up the affected (weak) leg.", "as": "මුලින්ම වේවැල ඉහළට තබන්න, පසුව නිරෝගී කකුලින් නඟින්න, අවසානයේ දුර්වල කකුල ඉහළට ගෙන එන්න.", "p": 138, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "STAIRS_CANE", "ic": "🦯"}, {"id": 24, "qe": "What safety procedure must be followed when guiding a care recipient in a manual wheelchair down a steep incline?", "qs": "බෑවුමකින් පහළට අතින් ක්‍රියාත්මක වන රෝද පුටුවක් ගෙන යන විට අනුගමනය කළ යුතු ආරක්ෂක ක්‍රියා පටිපාටිය කුමක්ද?", "ae": "Turn the wheelchair backward and walk down facing uphill, ensuring the occupant does not slip forward out of the seat.", "as": "රෝද පුටුව පසුපසට හරවා ඉහළට මුහුණලාගෙන පරිස්සමින් පහළට බැසීම.", "p": 145, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 25, "qe": "What physical alignment stabilizes the throat anatomy and reduces the risk of choking during eating?", "qs": "ආහාර ගැනීමේදී උගුරේ ව්‍යුහය ස්ථාවර කර හුස්ම හිරවීම වළක්වන ශරීර ඉරියව්ව කුමක්ද?", "ae": "Sitting upright with the head tilted slightly forward and the chin tucked down toward the chest.", "as": "කෙළින් වාඩි වී, හිස මඳක් ඉදිරියට නමා නිකට පපුව දෙසට හරවා ගැනීම.", "p": 149, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 26, "qe": "Which assistive device is most appropriate for a bedridden male care recipient who retains voluntary bladder control but cannot leave the bed?", "qs": "මුත්‍රා පාලනය කළ හැකි නමුත් ඇඳෙන් නැගිටීමට නොහැකි ඇඳටම වී සිටින පිරිමි සේවාලාභියෙකු සඳහා වඩාත්ම සුදුසු උපකරණය කුමක්ද?", "ae": "A portable, handheld urinal bottle designed for male anatomy.", "as": "පුරුෂයින් සඳහා විශේෂයෙන් නිර්මාණය කරන ලද අතේ ගෙන යා හැකි මුත්‍රා බෝතලයක් (Urinal).", "p": 160, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 27, "qe": "In which regions of the human body are apocrine sweat glands concentrated, requiring extra attention during daily hygiene to prevent odor?", "qs": "දුර්ගන්ධය වැළැක්වීම සඳහා දෛනික පිරිසිදු කිරීමේදී වැඩි අවධානයක් යොමු කළ යුතු, ඇපොක්‍රීන් දහඩිය ග්‍රන්ථි බහුලව පිහිටා ඇති ශරීර ප්‍රදේශ මොනවාද?", "ae": "The axillae (armpits) and the anogenital/perineal region.", "as": "කිහිලි සහ ජනනෙන්ද්‍රිය ප්‍රදේශය.", "p": 190, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 28, "qe": "What environmental adaptation helps an elderly resident who has high urinary urgency at night and fears slipping on the way to the bathroom?", "qs": "රාත්‍රී කාලයේ හදිසි මුත්‍රා අවශ්‍යතාවයක් ඇති සහ වැසිකිළියට යන අතරතුර ලිස්සා යෑමට බය වැඩිහිටියෙකුට උපකාරී වන පරිසර වෙනස් කිරීම කුමක්ද?", "ae": "Placing a stable portable commode (toilet) directly next to their bed for easy, low-risk access during the night.", "as": "රාත්‍රී කාලයේ පහසුවෙන් භාවිත කිරීමට ඇඳ අසලින්ම ස්ථායී ජංගම වැසිකිළියක් (Portable commode) තැබීම.", "p": 160, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 29, "qe": "To avoid cross-contamination, what is the precise method for removing used disposable examination gloves?", "qs": "හරස් ආසාදන වැළැක්වීම සඳහා, භාවිත කරන ලද බැහැර කළ හැකි පරීක්ෂණ අත්වැසුම් ගැලවිය යුතු නිවැරදි ක්‍රමය කුමක්ද?", "ae": "Peel the first glove off inside-out from the cuff, hold it in the gloved hand, slide a bare finger under the remaining cuff, and peel it off inside-out.", "as": "අත්වැසුම් පිටතට හරවා එක අතක අල්ලාගෙන, අනෙක් අත්වැසුමද එයට යටින් ගලවා ඉවත් කිරීම.", "p": 33, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 30, "qe": "How should a care worker frame questions for a care recipient with receptive aphasia who struggles to decode complex sentences?", "qs": "සංකීර්ණ වාක්‍ය තේරුම් ගැනීමට අපහසු ග්‍රාහක אפාසියා (Receptive aphasia) තත්ත්වය ඇති සේවාලාභියෙකුට සත්කාරකයා ප්‍රශ්න ඇසිය යුත්තේ කෙසේද?", "ae": "Use closed-ended questions that require only a simple \"yes\" or \"no\" response, accompanied by visual aids.", "as": "\"ඔව්\" හෝ \"නැත\" යනුවෙන් සරල පිළිතුරක් පමණක් අවශ්‍ය වන සංවෘත ප්‍රශ්න භාවිත කිරීම.", "p": 115, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 31, "qe": "What is the foundational mnemonic rule applied by care workers when dressing and undressing an individual with one-sided weakness?", "qs": "එක් පැත්තක දුර්වලතාවයක් ඇති පුද්ගලයෙකුට ඇඳුම් ඇඳීමේදී සහ ගැලවීමේදී සත්කාරකයන් අනුගමනය කරන මූලික නීතිය කුමක්ද?", "ae": "\"Dress the affected side first, undress the unaffected side first.\"", "as": "\"පීඩාවට පත් පැත්ත පළමුව ඇඳගන්න, නිරෝගී පැත්ත පළමුව ගලවන්න\".", "p": 176, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "DRESSING_RULE", "ic": "👕"}, {"id": 32, "qe": "What clinical signs should alert a care worker that an elderly client might be suffering from progressive dehydration?", "qs": "වැඩිහිටියෙකු ක්‍රමයෙන් විජලනයකට (Dehydration) ලක්වන බවට සත්කාරකයා දැනුවත් කළ යුතු සායනික ලක්ෂණ මොනවාද?", "ae": "Extreme dry mouth, reduced skin turgor, a sudden drop in urine output, and highly concentrated, dark-colored urine.", "as": "අධික ලෙස මුඛය වියළීම, සමේ ප්‍රත්‍‍යාස්ථතාව අඩුවීම, මුත්‍රා පිටවීම අඩුවීම සහ තද පැහැති මුත්‍රා පිටවීම.", "p": 74, "tc": "VITAL", "mt": "ශරීර කෘත්‍‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 33, "qe": "Which environmental modification is crucial for preventing accidental trips and falls inside an older adult's living room?", "qs": "වැඩිහිටියෙකුගේ მის කාමරය තුළ අත්වැරදීමෙන් ඇද වැටීම් වැළැක්වීම සඳහා අත්‍යවශ්‍ය වන පාරිසරික වෙනස්කම කුමක්ද?", "ae": "Installing continuous handrails, securing or removing loose area rugs, and keeping the floor free of clutter or liquid spills.", "as": "අඛණ්ඩ අත්වැටවල් සවි කිරීම, ලිස්සන සුළු කාපට් ඉවත් කිරීම සහ බිම අවුල් සහගත ද්‍රව්‍ය හෝ ජලය නොමැතිව තබා ගැනීම.", "p": 205, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 34, "qe": "When is the best time to perform nail trimming for an elderly individual with thick, brittle nails?", "qs": "ඝන, බිඳෙනසුලු නියපොතු ඇති වැඩිහිටියෙකුගේ නියපොතු කැපීමට වඩාත්ම සුදුසු කාලය කවදාද?", "ae": "Immediately following a bath or foot soak, as the warm moisture softens the keratin sheets, reducing the risk of splitting.", "as": "ස්නානය කිරීමෙන් හෝ පාද සේදීමෙන් පසුව (නියපොතු මෘදු වී ඇති අවස්ථාවක).", "p": 184, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 35, "qe": "How does expanding your base of support protect your musculoskeletal health during a heavy transfer?", "qs": "බර මාරු කිරීමකදී ඔබේ ආධාරක පදනම පුළුල් කිරීමෙන් මාංශ පේශි සෞඛ්‍යය ආරක්ෂා වන්නේ කෙසේද?", "ae": "Spreading your feet comfortably apart increases your physical stability and lowers your center of gravity, reducing lumbar strain.", "as": "පාද දෙක හොඳින් ඈත් කර තැබීමෙන් ශරීරයේ ස්ථායීතාවය වැඩි වන අතර කොඳු ඇට පෙළට යන පීඩනය අවම වේ.", "p": 38, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "BODY_MECHANICS", "ic": "🏋️"}, {"id": 36, "qe": "Which proactive measure helps clear the airway and prevents silent aspiration before a meal for a client with dysphagia?", "qs": "ගිලීමේ අපහසුතා ඇති සේවාලාභියෙකුට ආහාර ගැනීමට පෙර වායු මාර්ගය පිරිසිදු කර අපේක්ෂාව වැළැක්වීමට උපකාරී වන ක්‍රියාමාර්ගය කුමක්ද?", "ae": "Encouraging them to clear their throat or practice intentional deep coughing and swallowing exercises prior to eating.", "as": "ආහාර ගැනීමට පෙර උගුර පිරිසිදු කර ගැනීමට හෝ ගැඹුරු කැස්ස සහ ගිලීමේ අභ්‍යාස කිරීමට දිරිගැන්වීම.", "p": 148, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 37, "qe": "How should the height of a dining table be calibrated for a care recipient sitting in a standard chair?", "qs": "සාමාන්‍ය පුටුවක වාඩි වී සිටින සේවාලාභියෙකු සඳහා කෑම මේසයක උස සකස් කළ යුත්තේ කෙසේද?", "ae": "The table height should allow the user to rest their forearms comfortably flat on the surface with their elbows bent at a 90-degree angle.", "as": "වැලමිට අංශක 90 ක කෝණයකට නවමින් දෑත් මේසය මත සුවපහ ලෙස තැබිය හැකි උසකින් මේසය සකස් කිරීම.", "p": 149, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 38, "qe": "What cognitive behavioral symptoms are characteristically seen in the early-to-middle stages of Alzheimer's type dementia?", "qs": "අල්සයිමර් වර්ගයේ ඩිමෙන්ශියාවේ මුල් සිට මැද අවධීන්හිදී දක්නට ලැබෙන සංජානන හැසිරීම් ලක්ෂණ මොනවාද?", "ae": "Progressive short-term memory loss (forgetfulness), disorientation to time and place, and episodes of purposeless wandering.", "as": "කෙටිකාලීන මතකය ක්‍රමයෙන් క్షය වීම, කාලය හා ස්ථානය පිළිබඳ අවබෝධය නැති වීම සහ අරමුණක් නැතිව ඇවිදීම.", "p": 95, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 39, "qe": "Which equipment is used to manage bowel or bladder elimination for a female care recipient who is restricted to absolute bed rest?", "qs": "පූර්ණ ඇඳ විවේකයට සීමා වූ කාන්තා සේවාලාභිනියකගේ මලපහ හෝ මුත්‍රා බැහැර කිරීම කළමනාකරණය කිරීමට භාවිත කරන උපකරණය කුමක්ද?", "ae": "A molded plastic or metal bedpan positioned squarely under the pelvis.", "as": "ශ්‍රෝණියට යටින් තබන ලද ප්ලාස්ටික් හෝ ලෝහ ඇඳ බඳුනක් (Bedpan).", "p": 160, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 40, "qe": "When delivering an oral or written incident shift report to a supervisor, what rule must the care worker follow?", "qs": "අධීක්ෂකවරයෙකුට වාචික හෝ ලිඛිත මාරු වාර්තාවක් ඉදිරිපත් කිරීමේදී සත්කාර සේවකයා අනුගමනය කළ යුතු නීතිය කුමක්ද?", "ae": "Exclude subjective assumptions or emotional opinions; report only verifiable, objective facts of what was seen and heard.", "as": "ආත්මීය අනුමාන හෝ හැඟීම් බැහැර කර, දුටු සහ ඇසූ සත්‍ය සහ වෛෂයික කරුණු පමණක් වාර්තා කිරීම.", "p": 118, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 41, "qe": "Which group of functional tasks explicitly represents baseline Activities of Daily Living (ADL)?", "qs": "මූලික එදිනෙදා ජීවන ක්‍රියාකාරකම් (ADL) පැහැදිලිව නිරූපණය කරන කාර්යයන් කාණ්ඩය කුමක්ද?", "ae": "Essential self-care actions: eating, bathing, dressing, toileting, and basic indoor mobility/transferring.", "as": "කෑම කෑම, ස්නානය, ඇඳුම් ඇඳීම, වැසිකිළි යෑම සහ නිවස තුළ ගමන් කිරීම වැනි මූලික ක්‍රියාකාරකම්.", "p": 124, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 42, "qe": "If a conscious care recipient begins choking on food, is unable to speak, and cannot clear their airway via coughing, what emergency action must be taken?", "qs": "සිහිය ඇති සේවාලාභියෙකු ආහාර හිරවීම නිසා කතා කිරීමට නොහැකිව, කැස්සෙන් වායු මාර්ගය පිරිසිදු කර ගැනීමට නොහැකි නම් ගත යුතු හදිසි ක්‍රියාමාර්ගය කුමක්ද?", "ae": "Call for emergency medical help immediately and perform abdominal thrusts (the Heimlich maneuver).", "as": "වහාම වෛද්‍ය උදව් පතා හයිම්ලිච් ක්‍රමය (Abdominal thrusts) ක්‍රියාත්මක කිරීම.", "p": 80, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 43, "qe": "What is the local physiological purpose of applying a local warm compress to a care recipient's aching joint?", "qs": "වේදනාකාරී සන්ධියකට උණුසුම් සම්පීඩනයක් යෙදීමේ දේශීය කායික අරමුණ කුමක්ද?", "ae": "To induce local vasodilation, which increases blood flow, relaxes tense muscles, and alleviates chronic joint pain.", "as": "රුධිර සංසරණය වැඩි කිරීම, මාංශ පේශි ලිහිල් කිරීම සහ සන්ධි වේදනාව අඩු කිරීම සඳහා රුධිර වාහිනී ප්‍රසාරණය කිරීම.", "p": 189, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 44, "qe": "What physical symptoms indicate that a care recipient is suffering from severe, localized fecal impaction or constipation?", "qs": "සේවාලාභියෙකු දැඩි මලබද්ධයකින් හෝ මල සිරවීමකින් පෙළෙන බවට දක්වන භෞතික ලක්ෂණ මොනවාද?", "ae": "Straining to pass hard, dry stools, abdominal distension (bloating), and reports of localized abdominal discomfort.", "as": "වියළි මලපහ පිට කිරීමට වෙහෙසීම, උදරය පිපීම සහ උදරයේ අපහසුතා ඇති වීම.", "p": 75, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 45, "qe": "What is the absolute first mechanical safety step a care worker must take before initiating a transfer into or out of a wheelchair?", "qs": "රෝද පුටුවට මාරු වීමට හෝ ඉන් පිට වීමට පෙර සත්කාරකයා ගත යුතු නිරපේක්ෂ පළමු යාන්ත්‍රික ආරක්ෂක පියවර කුමක්ද?", "ae": "Ensure that the wheelchair's wheel locks (brakes) are fully engaged and both footrests are flipped up out of the way.", "as": "රෝද පුටුවේ තිරිංග සම්පූර්ණයෙන්ම යොදා ඇති බව සහ පාද තබන පුවරු ඉවතට ගෙන ඇති බව තහවුරු කර ගැනීම.", "p": 140, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 46, "qe": "To minimize the risk of choking and facilitate safe swallowing during a meal, how should an older adult be positioned while seated?", "qs": "වැඩිහිටියෙකුට ආහාර ගැනීමේදී හිරවීම අවම කර ආරක්ෂිතව ගිලීමට පහසු වන සේ වාඩි විය යුත්තේ කෙසේද?", "ae": "Sit upright with the back properly supported, feet resting flat on the floor, and the head tilted slightly forward with the chin tucked.", "as": "පිටුපසට නිසි ආධාරකයක් ඇතිව කෙළින් වාඩි වී, පාද බිම තබා, හිස මඳක් ඉදිරියට නමා නිකට ඇතුළට හරවා ගැනීම.", "p": 149, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 47, "qe": "What preparation must a care worker complete prior to assisting an older adult into the bathing area?", "qs": "වැඩිහිටියෙකු නාන කාමරයට රැගෙන යාමට පෙර සත්කාරකයා සම්පූර්ණ කළ යුතු සූදානම කුමක්ද?", "ae": "Arrange clean replacement clothing and towels beforehand to ensure a seamless change immediately following the bath.", "as": "ස්නානය කිරීමෙන් පසු වහාම ඇඳීමට පිරිසිදු ඇඳුම් සහ තුවා කලින්ම සූදානම් කර තැබීම.", "p": 193, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 48, "qe": "Which physiological condition causes an older adult to experience stress urinary incontinence?", "qs": "වැඩිහිටියෙකුට පීඩන ආතති මුත්‍රා අසංයමය (Stress incontinence) ඇති වීමට හේතු වන කායික තත්ත්වය කුමක්ද?", "ae": "An involuntary leakage of urine triggered by sudden abdominal pressure during actions like coughing, laughing, or lifting heavy objects due to weakened pelvic floor muscles.", "as": "දුර්වල වූ ශ්‍රෝණි තට්ටුවේ මාංශ පේශි නිසා කැස්ස, සිනාව හෝ බර ඉසිලීමේදී උදරීය පීඩනයෙන් මුත්‍රා කාන්දු වීම.", "p": 161, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "STRESS_INCONTINENCE", "ic": "💧"}, {"id": 49, "qe": "When evaluating a care recipient's Quality of Life (QOL), which metric is considered completely irrelevant to their personal care satisfaction?", "qs": "සේවාලාභියාගේ ජීවන තත්ත්වය (QOL) තක්සේරු කිරීමේදී, ඔවුන්ගේ පුද්ගලික සත්කාර තෘප්තියට සම්පූර්ණයෙන්ම අදාළ නොවන මිනුම කුමක්ද?", "ae": "The financial salary or wage rate of the caregiving staff providing the service.", "as": "සත්කාර සපයන කාර්ය මණ්ඩලයේ මූල්‍ය වැටුප් අනුපාතය.", "p": 14, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 50, "qe": "What is the correct technique for removing used disposable examination gloves to prevent cross-contamination?", "qs": "හරස් ආසාදන වැළැක්වීම සඳහා භාවිත කළ පරීක්ෂණ අත්වැසුම් ගැලවිය යුතු නිවැරදි ක්‍රමය කුමක්ද?", "ae": "Peel the glove off inside-out from the cuff without allowing your bare skin to make contact with the outer contaminated surface.", "as": "නිරාවරණය වූ සම සමඟ පිටත පෘෂ්ඨය ස්පර්ශ නොවන්නට කෆ් එකෙන් අත්වැසුම ඇතුළට හරවා ගැලවීම.", "p": 33, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 51, "qe": "When assisting a care recipient with left-sided hemiplegia to descend a flight of stairs, what is the correct sequence of movement?", "qs": "වම් පස අංශභාගය ඇති සේවාලාභියෙකුට පඩිපෙළින් පහළට බැසීමට උදව් කිරීමේදී අනුගමනය කළ යුතු නිවැරදි චලන අනුපිළිවෙළ කුමක්ද?", "ae": "Lower the walking cane first, step down with the left foot (affected side), and then follow with the right foot (unaffected side).", "as": "පළමුව වේවැල පහළට තබා, පසුව වම් කකුල (පීඩාවට පත් පැත්ත), සහ පසුව දකුණු කකුල (නිරෝගී පැත්ත) තබන්න.", "p": 138, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "STAIRS_CANE", "ic": "🦯"}, {"id": 52, "qe": "Which secondary health complications are commonly observed in older adults diagnosed with poorly managed diabetes mellitus?", "qs": "දුර්වල ලෙස පාලනය වන දියවැඩියාව ඇති වැඩිහිටියන් තුළ බහුලව දක්නට ලැබෙන ද්විතියික සෞඛ්‍ය ගැටළු මොනවාද?", "ae": "Delayed wound healing, peripheral neuropathy (numbness), and visual impairment due to retinopathy.", "as": "තුවාල සුව වීමට ප්‍රමාද වීම, ස්නායු දුර්වලතා (කිළින වීමේ අඩුව) සහ අක්ෂි ආබාධ.", "p": 81, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 53, "qe": "Which methodology should a care worker adopt when communicating with a care recipient who has a severe hearing impairment?", "qs": "දැඩි ශ්‍රවන ආබාධයක් ඇති සේවාලාභියෙකු සමඟ සන්නිවේදනය කිරීමේදී සත්කාරකයා අනුගමනය කළ යුතු ක්‍රමවේදය කුමක්ද?", "ae": "Face the individual directly, maintain clear eye contact, speak slowly in short, distinct sentences, and utilize expressive facial gestures.", "as": "සෘජුව මුහුණලා, ඇස් ස්පර්ශය පවත්වා ගනිමින්, සෙමින් කෙටි වාක්‍ය වලින් කතා කිරීම සහ මුහුණේ ඉරියව් භාවිත කිරීම.", "p": 113, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 54, "qe": "What is the critical initial safety action a care worker must take before moving a care recipient in a wheelchair down a steep slope?", "qs": "බෑවුමකින් රෝද පුටුව පහළට ගෙන යාමට පෙර සත්කාරකයා ගත යුතු තීරණාත්මක ආරම්භක ආරක්ෂක පියවර කුමක්ද?", "ae": "Verify that the manual brakes are functional, turn the wheel backward, and stand securely behind it to manage the descent.", "as": "තිරිංග ක්‍රියාත්මක දැයි පරීක්ෂා කර, රෝද පුටුව පසුපසට හරවා, පිටුපසින් ආරක්ෂිතව සිටිමින් පහළට බැසීම.", "p": 145, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 55, "qe": "Which factor is most effective in preventing accidental slips and trips when an older adult is ambulatory within a care facility?", "qs": "සත්කාරක ආයතනයක් තුළ වැඩිහිටියෙකු ඇවිදින විට අහම්බෙන් ලිස්සා වැටීම් වැළැක්වීමට වඩාත්ම ඵලදායී සාධකය කුමක්ද?", "ae": "Ensuring the care recipient wears well-fitting, stable, non-slip footwear rather than loose slippers or walking barefoot.", "as": "ලිස්සා නොයන, හොඳින් ගැළපෙන සපත්තු හෝ පාවහන් පැළඳීම තහවුරු කිරීම.", "p": 28, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 56, "qe": "How should a care worker position a bedridden care recipient to execute a safe and ergonomic diaper change?", "qs": "ඇඳටම වී සිටින සේවාලාභියෙකුගේ ඩයපර් එකක් ආරක්ෂිතව මාරු කිරීම සඳහා සත්කාරකයා ඔවුන් පිහිටුවිය යුත්තේ කෙසේද?", "ae": "Turn the care recipient onto their side (lateral recumbent position) and securely raise the opposite side bed rails to prevent falls.", "as": "සේවාලාභියා පැත්තකට හරවා වැටීම වැළැක්වීම සඳහා විරුද්ධ පැත්තේ ඇඳ රේල් ඉහළ නැංවීම.", "p": 170, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 57, "qe": "When performing partial body cleansing or a bed bath for a care recipient, what directional rule must be followed?", "qs": "සේවාලාභියෙකුට අර්ධ ශරීර සේදීමක් හෝ ඇඳ නානක් කිරීමේදී අනුගමනය කළ යුතු දිශානුගත නීතිය කුමක්ද?", "ae": "Always wipe starting from the cleanest structural zones moving toward the dirtier or highly contaminated areas.", "as": "සෑම විටම පිරිසිදු ප්‍රදේශයේ සිට අපිරිසිදු ප්‍රදේශය දෙසට පිස දැමීම.", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 58, "qe": "What is the correct mechanical sequence of the normal ingestion and swallowing process?", "qs": "සාමාන්‍ය ආහාර ගැනීම සහ ගිලීමේ ක්‍රියාවලියේ නිවැරදි යාන්ත්‍රික අනුපිළිවෙළ කුමක්ද?", "ae": "Mastication (chewing) → Bolus formation → Pharyngeal propulsion (moving food back) → Deglutition (swallowing).", "as": "හැපීම → බෝලයක් ලෙස සෑදීම → ග්‍රසනිකාව හරහා ගමන් කිරීම → ගිලීම.", "p": 148, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 59, "qe": "What body position should a care worker maintain while guiding a wheelchair user down a steep downward incline?", "qs": "බෑවුමකින් පහළට රෝද පුටුවක් ගෙන යන විට සත්කාරකයා පවත්වා ගත යුත්තේ කුමන ශරීර ඉරියව්වද?", "ae": "Position your body behind the wheelchair, bracing your weight by leaning slightly backward to counteract gravity and control the speed.", "as": "රෝද පුටුව පිටුපස සිටිමින්, ගුරුත්වාකර්ෂණයට එරෙහිව බර පාලනය කිරීමට මඳක් පසුපසට නැමී සිටීම.", "p": 145, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 60, "qe": "In clinical care, what does the diagnostic term \"incontinence\" specifically refer to?", "qs": "සායනික සත්කාරවලදී \"අසංයමය\" (Incontinence) යන රෝග විනිශ්චය පදය විශේෂයෙන් සඳහන් කරන්නේ කුමක් ද?", "ae": "The complete or partial loss of voluntary control over bladder or bowel elimination functions.", "as": "මුත්‍රා හෝ මලපහ පිටවීම ස්වේච්ඡාවෙන් පාලනය කිරීමට ඇති සම්පූර්ණ හෝ අර්ධ නොහැකියාව.", "p": 161, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 61, "qe": "What are the primary cognitive manifestations that characterize the onset and progression of Alzheimer's dementia?", "qs": "අල්සයිමර් ඩිමෙන්ශියාවේ ආරම්භය සහ ප්‍රගතිය සංලක්ෂිත කරන ප්‍රධාන සංජානන ප්‍රකාශනයන් මොනවාද?", "ae": "Progressive short-term memory impairment and disorientation regarding current time, dates, and geographic locations.", "as": "කෙටිකාලීන මතකය පිරිහීම සහ කාලය, දිනය සහ ස්ථාන පිළිබඳ අවබෝධය නැති වීම.", "p": 95, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 62, "qe": "What is the correct head-to-toe cleaning sequence for a full-body bed bath?", "qs": "සම්පූර්ණ ශරීරය ඇඳ මත සේදීමේදී හිසේ සිට පය දක්වා පිරිසිදු කළ යුතු නිවැරදි අනුපිළිවෙළ කුමක්ද?", "ae": "Face → Upper extremities (arms) → Chest → Abdomen → Lower extremities (legs) → Back → Perineal region.", "as": "මුහුණ → ඉහළ අන්ත (දෑත්) → පපුව → උදරය → පහළ අන්ත (කකුල්) → පිටුපස → ජනනෙන්ද්‍රිය ප්‍රදේශය.", "p": 199, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "BED_BATH_SEQUENCE", "ic": "🧼"}, {"id": 63, "qe": "Where should a care worker sit when providing direct feeding assistance to a care recipient who has one-sided paralysis?", "qs": "එක් පැත්තක අංශභාගය ඇති සේවාලාභියෙකුට ආහාර ලබා දීමේදී සත්කාරකයා වාඩි විය යුත්තේ කොතැනද?", "ae": "Sit comfortably at the exact same eye level as the resident, positioning yourself on their unaffected (healthy) side.", "as": "සේවාලාභියාගේ ඇස් මට්ටමටම හිඳ, ඔවුන්ගේ නිරෝගී පැත්තෙන් වාඩි වීම.", "p": 152, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 64, "qe": "What is the primary intervention for a care worker managing an older adult experiencing acute or chronic diarrhea?", "qs": "උග්‍ර හෝ නිදන්ගත පාචනයකින් පෙළෙන වැඩිහිටියෙකු කළමනාකරණය කිරීමේදී සත්කාරකයාගේ මූලික මැදිහත්වීම කුමක්ද?", "ae": "Provide immediate oral rehydration solutions to combat dehydration, monitor vital signs, and meticulously document stool characteristics.", "as": "විජලනය වැළැක්වීම සඳහා විද්‍යුත් විච්ඡේදක දියර (ORS) ලබා දීම සහ මලපහ වල ස්වභාවය වාර්තා කිරීම.", "p": 162, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 65, "qe": "Which care recipient profile is most suited for using a specialized female bed urinal (pispot)?", "qs": "කාන්තා ඇඳ මුත්‍රා බඳුනක් (Urinal) භාවිත කිරීමට වඩාත්ම සුදුසු සේවාලාභී පැතිකඩ කුමක්ද?", "ae": "Female care recipients restricted to absolute bed rest or those experiencing severe knee joint pain that prevents ambulation to the restroom.", "as": "පූර්ණ ඇඳ විවේකයට සීමා වූ හෝ වැසිකිළියට යාමට නොහැකි තරම් දණහිසේ දැඩි වේදනාවන් ඇති කාන්තා සේවාලාභීන්.", "p": 160, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 66, "qe": "What is the safe, standard water temperature range for older adults during tub bathing assistance?", "qs": "නාන තටාකයේ ස්නානය කිරීමේදී වැඩිහිටියන් සඳහා ආරක්ෂිත, ප්‍රමිතිගත ජල උෂ්ණත්ව පරාසය කුමක්ද?", "ae": "Between 40^°C and 42^°C, while strictly maintaining environmental privacy.", "as": "සෙල්සියස් අංශක 40 ත් 42 ත් අතර අගයක්.", "p": 192, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 67, "qe": "What is the ultimate objective of implementing Quality of Life (QOL) principles within customized elderly care plans?", "qs": "අභිරුචිකරණය කළ වැඩිහිටි සත්කාර සැලසුම් තුළ ජීවන තත්ත්ව (QOL) මූලධර්ම ක්‍රියාත්මක කිරීමේ අවසාන අරමුණ කුමක්ද?", "ae": "To empower older adults to live fulfilling, meaningful, and self-directed lives that maximize their remaining functional capabilities.", "as": "වැඩිහිටියන්ට අර්ථවත් සහ ස්වයං-පාලිත ජීවිතයක් ගත කිරීමට බලගැන්වීම.", "p": 14, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 68, "qe": "How should a care worker respond if an older adult expresses strong aversion or refuses to take their scheduled bath?", "qs": "වැඩිහිටියෙකු ස්නානය කිරීම දැඩි ලෙස ප්‍රතික්ෂේප කරන්නේ නම් සත්කාරකයා ප්‍රතිචාර දැක්විය යුත්තේ කෙසේද?", "ae": "Respect their autonomy, calmly investigate the underlying reason without using force, and re-propose the activity at a later time.", "as": "බලහත්කාරයෙන් තොරව, ඔවුන්ගේ ස්වයං පාලනයට ගරු කරමින්, හේතුව විමසා පසුව උත්සාහ කිරීම.", "p": 116, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 69, "qe": "What is the foundational rule for assisting a care recipient with left-sided hemiplegia when putting on clothing?", "qs": "වම් පස අංශභාගය ඇති සේවාලාභියෙකුට ඇඳුම් ඇඳීමේදී අනුගමනය කළ යුතු මූලික නීතිය කුමක්ද?", "ae": "Initiate dressing by sliding the clothing sleeve onto the left arm (the paralyzed or affected side) first.", "as": "පළමුව වම් පැත්තේ (පීඩාවට පත්) අතට ඇඳුම් කමහ දැමීම.", "p": 176, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 70, "qe": "When feeding a care recipient with left-sided oral hemiplegia, where should the spoon be directed inside the mouth?", "qs": "මුඛයේ වම් පස අංශභාගය ඇති සේවාලාභියෙකුට ආහාර කැවීමේදී හැන්ද මුඛයේ කුමන පැත්තට යොමු කළ යුතුද?", "ae": "Introduce food carefully toward the right side of the mouth (the unaffected side) where sensation and muscle control are normal.", "as": "මුඛයේ දකුණු පැත්තට (නිරෝගී පැත්තට) ආහාර ඇතුළත් කිරීම.", "p": 153, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 71, "qe": "Which anatomical positioning error drastically increases the risk of airway aspiration and choking during meals?", "qs": "ආහාර ගැනීමේදී වායු මාර්ගයට ආහාර ඇතුළුවීමේ සහ හිරවීමේ අවදානම දැඩි ලෙස වැඩි කරන වැරදි ඉරියව්ව කුමක්ද?", "ae": "Allowing a care recipient to eat while lying completely flat on their back or with their neck hyperextended backward.", "as": "සම්පූර්ණයෙන්ම පැතලි ලෙස ඇඳ මත දිගා වී හෝ බෙල්ල පිටුපසට හරවා ආහාර ගැනීම.", "p": 149, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 72, "qe": "Where should a manual wheelchair be parked when preparing to transfer a mobile client out of bed?", "qs": "ඇඳෙන් සේවාලාභියෙකු රෝද පුටුවට මාරු කිරීමට සූදානම් වීමේදී රෝද පුටුව නැවැත්විය යුත්තේ කොතැනද?", "ae": "Position the wheelchair alongside the care recipient's unaffected (healthy) side at an angle of 30 to 45 degrees relative to the mattress line.", "as": "ඇඳට සාපේක්ෂව අංශක 30 ත් 45 ත් අතර කෝණයකින්, සේවාලාභියාගේ නිරෝගී පැත්තෙන් රෝද පුටුව තැබීම.", "p": 140, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "WHEELCHAIR_ANGLE", "ic": "🧑‍ෲ"}, {"id": 73, "qe": "Which conversational framework should be utilized when engaging with a care recipient suffering from expressive or receptive aphasia?", "qs": "ප්‍රකාශන හෝ ග්‍රාහක אפාසියා (Aphasia) තත්ත්වයෙන් පෙළෙන සේවාලාභියෙකු සමඟ කතා කිරීමේදී භාවිත කළ යුතු සංවාද රාමුව කුමක්ද?", "ae": "Pose closed questions that require simple binary answers (yes/no) and utilize concrete picture cards, symbols, or physical gestures.", "as": "ඔව්/නැත වැනි සරල පිළිතුරු අවශ්‍ය වන ප්‍රශ්න ඇසීම සහ පින්තූර කාඩ්පත් හෝ අභිනයන් භාවිත කිරීම.", "p": 115, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 74, "qe": "What is the correct procedure for guiding a care recipient with severe visual impairment during ambulation?", "qs": "දැඩි දෘශ්‍යාබාධයක් ඇති සේවාලාභියෙකු ඇවිදීමේදී මඟ පෙන්වීම සඳහා අනුගමනය කළ යුතු නිවැරදි ක්‍රියා පටිපාටිය කුමක්ද?", "ae": "Walk slightly ahead of the individual, allowing them to firmly grasp your elbow or forearm for stability and structural direction.", "as": "පුද්ගලයාට තරමක් ඉදිරියෙන් ගමන් කරමින්, ඔවුන්ට ඔබේ වැලමිට හෝ අතින් අල්ලා ගැනීමට ඉඩ සැලසීම.", "p": 112, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 75, "qe": "What observation checklist must a care worker monitor during meal assistance to prevent dysphagic choking?", "qs": "ගිලීමේ අපහසුතා ඇති සේවාලාභීන්ට ආහාර ලබා දීමේදී හිරවීම වැළැක්වීම සඳහා සත්කාරකයා නිරීක්ෂණය කළ යුතු පිරික්සුම් ලැයිස්තුව කුමක්ද?", "ae": "Confirm the client has completely masticated and swallowed the previous bite before introducing more food, without rushing their pace.", "as": "මීළඟ කටවගය ලබාදීමට පෙර පෙර කටවගය හොඳින් සපී ගිල දමා ඇද්දැයි තහවුරු කර ගැනීම.", "p": 153, "tc": "MEAL", "mt": "ආහාර ගැනීමේ සත්කාර (Meal Care)", "st": "ගිලීමේ අවධීන් සහ ඔරලෝසු කටු ක්‍රමය", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 76, "qe": "What is the correct anatomical path that urine follows from its production site to elimination from the human body?", "qs": "මුත්‍‍රා නිපදවීමේ සිට ශරීරයෙන් ඉවත් වන තුරු මුත්‍රා ගමන් කරන නිවැරදි ව්‍යුහ විද්‍යාත්මක මාර්ගය කුමක්ද?", "ae": "Kidneys → Ureters → Bladder → Urethra.", "as": "වකුගඩු → මුත්‍රා වාහිනී → මුත්‍රාශය → මුත්‍රා මාර්ගය.", "p": 156, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 77, "qe": "When is the most efficient and safe time to perform nail trimming for an elderly care recipient?", "qs": "වැඩිහිටි සේවාලාභියෙකුගේ නියපොතු කැපීමට වඩාත්ම කාර්යක්ෂම සහ ආරක්ෂිත කාලය කවදාද?", "ae": "Immediately following a bath or warm water soak, when the nail plates are softened and less prone to splintering.", "as": "ස්නානය කිරීමෙන් හෝ උණුසුම් වතුරේ තිසීමෙන් පසු.", "p": 184, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 78, "qe": "Which anatomical regions of an older adult require highly meticulous cleaning during hygiene care due to skin folds?", "qs": "සමේ රැලි නිසා වැඩිහිටියෙකුගේ සනීපාරක්ෂක සත්කාරවලදී ඉතා පරිස්සමින් පිරිසිදු කළ යුතු ශරීර ප්‍රදේශ මොනවාද?", "ae": "The axillae (armpits), interdigital spaces (between fingers/toes), submammary folds (under breasts), and the perineal region.", "as": "කිහිලි, ඇඟිලි අතර, පියයුරු යට සහ ජනනෙන්ද්‍රිය ප්‍රදේශය.", "p": 191, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 79, "qe": "What postural adjustment must a care worker make to perform safe lifting maneuvers under body mechanics guidelines?", "qs": "ශරීර යාන්ත්‍ර විද්‍යා මාර්ගෝපදේශ යටතේ ආරක්ෂිත එසවුම් ක්‍රියා සිදු කිරීමට සත්කාරකයා කළ යුතු ඉරියව් වෙනස් කිරීම කුමක්ද?", "ae": "Flex at the knees, widen your stance to establish a broad base of support, and actively lower your center of gravity.", "as": "දණහිසින් නැමී, පාද ඈත් කර පුළුල් ආධාරක පදනමක් සකසා ගුරුත්වාකර්ෂණ කේන්ද්‍රය පහත හෙළීම.", "p": 38, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "BODY_MECHANICS", "ic": "🏋️"}, {"id": 80, "qe": "Why do low-impact falls frequently result in severe femoral neck fractures among elderly individuals?", "qs": "අඩු බලපෑමකින් වැටීමක් සිදුවුවද වැඩිහිටියන් අතර බරපතල කලවා අස්ථි ග්‍රීවයේ අස්ථි බිඳීම් ඇති වීමට හේතුව කුමක්ද?", "ae": "Due to the progressive loss of bone mineral density associated with age-related osteoporosis making bones brittle.", "as": "ඔස්ටියෝපොරෝසිස් නිසා අස්ථිවල ඝනත්වය අඩුවී අස්ථි බිඳෙනසුලු වීම නිසා.", "p": 82, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 81, "qe": "Which systematic indicators signify that an older adult is experiencing systemic dehydration?", "qs": "වැඩිහිටියෙකු පද්ධතිමය විජලනයකින් පෙළෙන බව පෙන්වන ක්‍රමානුකූල දර්ශක මොනවාද?", "ae": "Marked dryness of the oral mucosa, oliguria (low volume urine), systemic fatigue, and cognitive confusion.", "as": "මුඛයේ ශ්ලේෂ්මල පටල වියළීම, මුත්‍රා පිටවීම අඩුවීම, දැඩි විඩාව සහ මානසික අවුල් සහගත බව.", "p": 74, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 82, "qe": "If an institutionalized resident experiencing loneliness says, \"I want to see my deceased son,\" what is the most appropriate response?", "qs": "ආයතනයක සිටින පාලුවෙන් පෙළෙන සේවාලාභියෙකු \"මට මගේ මියගිය පුතාව බලන්න ඕන\" යැයි පවසන්නේ නම් වඩාත්ම සුදුසු ප්‍රතිචාරය කුමක්ද?", "ae": "Use validation techniques by saying: \"You miss him very much, don't you? Please tell me about your favorite memories of him.\"", "as": "\"ඔබ ඔහුට ගොඩක් ආදරෙයි, නේද? ඔහු ගැන ඔබේ ප්‍රියතම මතකයන් මට කියන්න\" ලෙස අනුකම්පාවෙන් පිළිතුරු දීම.", "p": 116, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 83, "qe": "Beyond baseline dental hygiene, what major systemic medical condition is directly prevented by performing routine oral care?", "qs": "මූලික දන්ත සනීපාරක්ෂාවට අමතරව, නිතිපතා මුඛ සත්කාර කිරීමෙන් සෘජුවම වළක්වන ප්‍රධාන වෛද්‍ය තත්ත්වය කුමක්ද?", "ae": "Aspiration pneumonia, by significantly reducing pathogenic bacterial colonization in the oral cavity.", "as": "මුඛ කුහරයේ බැක්ටීරියා අඩු කිරීම මඟින් අපේක්ෂණ නියුමෝනියාව (Aspiration pneumonia) වැළැක්වීම.", "p": 185, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 84, "qe": "What are the physical and circulatory benefits of warm tub bathing for an older adult?", "qs": "වැඩිහිටියෙකු උණුසුම් ජල නාන තටාකයක ස්නානය කිරීමෙන් ලැබෙන කායික හා රුධිර සංසරණ ප්‍රතිලාභ මොනවාද?", "ae": "It induces vasodilation to improve blood flow, alleviates muscular spasms, cleanses the skin, and reduces stress hormones.", "as": "රුධිර සංසරණය වැඩි කිරීමට රුධිර වාහිනී ප්‍රසාරණය කරයි, මාංශ පේශි කැක්කුම් අඩු කරයි සහ සම පිරිසිදු කරයි.", "p": 189, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 85, "qe": "What is the primary physiological function executed by the human gastrointestinal system?", "qs": "මිනිස් ආමාශයික පද්ධතිය මඟින් ඉටු කරනු ලබන ප්‍රධාන කායික කාර්යය කුමක්ද?", "ae": "The mechanical and chemical breakdown of food, absorption of essential life nutrients, and excretion of solid waste components.", "as": "ආහාර දිරවීම, පෝෂ්‍ය පදාර්ථ අවශෝෂණය කර ගැනීම සහ අපද්‍රව්‍ය ඉවත් කිරීම.", "p": 65, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 86, "qe": "What is the name of the social insurance system established in Japan that legally funds long-term care services?", "qs": "දිගු කාලීන සත්කාර සේවා සඳහා නීත්‍යානුකූලව අරමුදල් සපයන ජපානයේ පිහිටුවා ඇති සමාජ රක්ෂණ ක්‍රමයේ නම කුමක්ද?", "ae": "The Long-Term Care Insurance System (Kaigo Hoken).", "as": "දිගු කාලීන සත්කාර රක්ෂණ ක්‍රමය (Kaigo Hoken).", "p": 25, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 87, "qe": "What does the core caregiving concept of \"Support for Independence\" (Jiritsu Shien) explicitly mandate?", "qs": "\"ස්වාධීනත්වයට සහය වීම\" (Jiritsu Shien) යන මූලික සාත්තු සේවා සංකල්පයෙන් පැහැදිලිව විධානය කරන්නේ කුමක්ද?", "ae": "Assisting care recipients to perform daily tasks utilizing their remaining physical functions rather than performing the entire task for them.", "as": "සේවාලාභියාට ඉතිරිව ඇති කාර්යයන් තනිව කිරීමට ඉඩ දෙමින් අවම සහයෝගයක් ලබා දීම.", "p": 15, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 88, "qe": "Under what physiological or daily conditions does the human sympathetic nervous system become dominant?", "qs": "මිනිස් අනුකම්පා සහගත ස්නායු පද්ධතිය (Sympathetic nervous system) ආධිපත්‍යය දරන්නේ කුමන කායික හෝ දෛනික තත්ත්වයන් යටතේද?", "ae": "During waking hours, periods of physical exertion, active emotional excitement, or acute stress states.", "as": "අවදිව සිටින විට, ශාරීරික වෙහෙසකදී, මානසික උද්දීපනයකදී හෝ දැඩි ආතති අවස්ථාවකදී.", "p": 58, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 89, "qe": "Which modifications are essential to create a safe, fall-free architectural environment inside an older adult's living space?", "qs": "වැඩිහිටියෙකුගේ ජීවන අවකාශය තුළ ආරක්ෂිත, ඇද වැටීම්වලින් තොර වාස්තු විද්‍යාත්මක පරිසරයක් නිර්මාණය කිරීමට අත්‍යවශ්‍ය වෙනස්කම් මොනවාද?", "ae": "Secure continuous handrails along walls, optimize high-lumen, glare-free lighting, and clear away all loose extension cords from walking paths.", "as": "බිත්ති දිගේ අත්වැටවල් සවි කිරීම, හොඳ ආලෝකයක් ලබා දීම සහ බිම ඇති කේබල් හෝ බාධක ඉවත් කිරීම.", "p": 205, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 90, "qe": "What framework must a professional care worker utilize to write accurate, high-quality care shifts or accident logs?", "qs": "වෘත්තීය සාත්තු සේවා සේවකයෙකු නිවැරදි, උසස් තත්ත්වයේ මාරු වාර්තා හෝ අනතුරු සටහන් ලිවීමට භාවිත කළ යුතු රාමුව කුමක්ද?", "ae": "Apply the 5W1H principle (Who, When, Where, What, Why, How) to document purely objective, factual data without injecting subjective bias.", "as": "ආත්මීය අදහස්වලින් තොරව සත්‍ය කරුණු පමණක් ඇතුළත් 5W1H ක්‍රමය භාවිත කිරීම.", "p": 119, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 91, "qe": "What framework does the ICF use to understand a person's health holistically by looking at structures, activities, environmental factors, and personal participation?", "qs": "ව්‍යුහයන්, ක්‍රියාකාරකම්, පාරිසරික සාධක සහ පුද්ගලික සහභාගීත්වය දෙස බැලීමෙන් පුද්ගලයෙකුගේ සෞඛ්‍යය සමස්තයක් ලෙස අවබෝධ කර ගැනීමට ICF භාවිත කරන රාමුව කුමක්ද?", "ae": "The International Classification of Functioning, Disability and Health (ICF).", "as": "ජාත්‍යන්තර ක්‍රියාකාරීත්ව, ආබාධිත සහ සෞඛ්‍ය වර්ගීකරණය (ICF).", "p": 83, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 92, "qe": "What target does the concept of QOL focus on maximizing for care recipients in daily care settings?", "qs": "දෛනික සත්කාර සැකසුම් තුළ සත්කාර ලබන්නන් සඳහා ජීවන තත්ත්ව (QOL) සංකල්පය උපරිම කිරීමට අවධානය යොමු කරන්නේ කුමන ඉලක්කය මතද?", "ae": "The client's overall lifestyle satisfaction, personal happiness, and self-determined standard of living.", "as": "සේවාලාභියාගේ සමස්ත ජීවන තෘප්තිය, පුද්ගල සතුට සහ ස්වයං-නිර්ණිත ජීවන තත්ත්වය.", "p": 14, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 93, "qe": "What is the most accurate approach a care worker must take when establishing a formalized care plan?", "qs": "විධිමත් සත්කාර සැලැස්මක් ස්ථාපිත කිරීමේදී සත්කාර සේවකයෙකු අනුගමනය කළ යුතු වඩාත්ම නිරුද්ධ ප්‍රවේශය කුමක්ද?", "ae": "Formulate the plan based directly on the individual needs, personal goals, and specific lifestyle preferences of the care recipient.", "as": "සේවාලාභියාගේ පුද්ගලික අවශ්‍යතා, අරමුණු සහ ජීවන රටාව මත පදනම්ව සත්කාර සැලැස්ම සකස් කිරීම.", "p": 26, "tc": "HYGIENE", "mt": "සනීපාරක්ෂාව සහ ආසාදන පාලනය (Hygiene)", "st": "අත්වැසුම් ගැලවීම සහ දෑත් සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 94, "qe": "What is the biological definition of homeostasis within the human body?", "qs": "මිනිස් සිරුර තුළ හෝමියෝස්ටේසිස් (Homeostasis) යන්නෙහි ජීව විද්‍යාත්මක අර්ථ දැක්වීම කුමක්ද?", "ae": "The internal physiological mechanism that maintains stable, balanced conditions (such as temperature and fluid balance) despite changes in the external environment.", "as": "බාහිර පරිසරයේ වෙනස්කම් හමුවේ ශරීරයේ අභ්‍යන්තර තත්ත්වයන් (උෂ්ණත්වය, තරල සමතුලිතතාවය) ස්ථාවරව පවත්වා ගැනීම.", "p": 49, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 95, "qe": "When assisting a care recipient with changing their clothes, how should the care worker support their personal dignity?", "qs": "සේවාලාභියෙකුට ඇඳුම් මාරු කිරීමට උදව් කිරීමේදී සත්කාරකයා ඔවුන්ගේ පුද්ගලික ගෞරවය ආරක්ෂා කළ යුත්තේ කෙසේද?", "ae": "Encourage and protect their autonomy by allowing them to choose their own clothes and actively select what they want to wear.", "as": "තමන්ට අවශ්‍ය ඇඳුම් තෝරා ගැනීමට ඉඩ සැලසීම මඟින් ඔවුන්ගේ ස්වයං පාලනය සහ ගෞරවය ආරක්ෂා කිරීම.", "p": 175, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 96, "qe": "What is a critical environmental consideration when performing daily cleaning inside a care recipient's room?", "qs": "සේවාලාභියෙකුගේ කාමරය තුළ දෛනික පිරිසිදු කිරීම් සිදු කිරීමේදී සැලකිලිමත් විය යුතු අත්‍යවශ්‍ය පාරිසරික කාරණය කුමක්ද?", "ae": "Always return furniture, personal items, and mobility aids back to their exact original locations to maintain safety and familiarity.", "as": "ආරක්ෂාව සහ හුරුපුරුදුබව පවත්වා ගැනීම සඳහා ගෘහ භාණ්ඩ සහ පුද්ගලික ද්‍රව්‍ය මුල් තිබූ ස්ථානවලටම නැවත තැබීම.", "p": 203, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 97, "qe": "What is a fundamental ethical requirement regarding a care recipient's personal and medical information?", "qs": "සේවාලාභියෙකුගේ පුද්ගලික සහ වෛද්‍ය තොරතුරු සම්බන්ධයෙන් ඇති මූලික සදාචාරාත්මක අවශ්‍යතාවය කුමක්ද?", "ae": "Maintain strict confidentiality and never disclose or leak personal data or private life details without explicit permission.", "as": "දැඩි රහස්‍යභාවයක් පවත්වා ගැනීම සහ අවසරයකින් තොරව පුද්ගලික දත්ත හෙළි නොකිරීම.", "p": 19, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 98, "qe": "What architectural feature is vital to maintain safety in corridors, ramps, or sloped pathways inside a care facility?", "qs": "සත්කාරක ආයතනයක කොරිඩෝ, බෑවුම් හෝ නැමුණු මාර්ගවල ආරක්ෂාව පවත්වා ගැනීමට අත්‍යවශ්‍ය වාස්තු විද්‍යාත්මකාංගය කුමක්ද?", "ae": "Install continuous, secure handrails along the walls to provide structural support and prevent accidental falls.", "as": "බිත්ති දිගේ අඛණ්ඩ, ආරක්ෂිත අත්වැටවල් සවි කිරීම.", "p": 205, "tc": "ENVIRONMENT", "mt": "ජීවන පරිසරය (Living Environment)", "st": "කාමර පිරිසිදු කිරීම සහ රෙදි සේදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 99, "qe": "How should a care worker adjust their posture under body mechanics guidelines to minimize the risk of occupational lower back injury?", "qs": "වෘත්තීයමය පහළ පිටේ තුවාල වීමේ අවදානම අවම කර ගැනීමට ශරීර යාන්ත්‍ර විද්‍යා මාර්ගෝපදේශ යටතේ සත්කාරකයා තමන්ගේ ඉරියව් සකස් කරගත යුත්තේ කෙසේද?", "ae": "Widen the base of support by spreading the feet comfortably apart and lower the center of gravity by flexing the knees.", "as": "පාද හොඳින් ඈත් කර ආධාරක පදනම පුළුල් කර දණහිස් නැමීමෙන් ගුරුත්වාකර්ෂණ කේන්ද්‍රය පහත හෙළීම.", "p": 38, "tc": "BODY_MECH", "mt": "ශරීර යාන්ත්‍ර විද්‍යාව (Body Mechanics)", "st": "උත්තෝලක මූලධර්මය සහ ගුරුත්ව කේන්ද්‍රය", "vt": "BODY_MECHANICS", "ic": "🏋️"}, {"id": 100, "qe": "Which bone is highly susceptible to severe, debilitating fractures during a low-impact fall in elderly individuals?", "qs": "වැඩිහිටියන්ගේ අඩු බලපෑමකින් වැටීමකදී බරපතල ලෙස බිඳී යාමට ඉඩ ඇති අස්ථිය කුමක්ද?", "ae": "The femoral neck (the upper portion of the thigh bone near the hip joint).", "as": "කලවා අස්ථි ග්‍රීවය (Femoral neck).", "p": 82, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 101, "qe": "What are the major physiological benefits of performing consistent, proper oral care for an older adult?", "qs": "වැඩිහිටියෙකුට නිසි පරිදි මුඛ සත්කාර කිරීමෙන් ලැබෙන ප්‍රධාන කායික ප්‍රතිලාභ මොනවාද?", "ae": "It maintains oral health, enhances the ability to enjoy meals, and actively prevents the development of aspiration pneumonia.", "as": "මුඛ සෞඛ්‍යය ආරක්ෂා කරයි, ආහාර රස විඳීමට උපකාරී වේ සහ අපේක්ෂණ නියුමෝනියාව වළක්වයි.", "p": 185, "tc": "DRESSING", "mt": "ඇඳුම් ඇඳීම සහ මුඛ සත්කාර (Grooming)", "st": "අංශභාග ඇඳුම් ඇඳීමේ නීති සහ දත් මැදීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 102, "qe": "What is the absolute first action a care worker should take prior to initiating any bathing assistance?", "qs": "ස්නානය සඳහා සහය වීමට පෙර සත්කාරකයා ගත යුතු නිරපේක්ෂ පළමු ක්‍රියාමාර්ගය කුමක්ද?", "ae": "Carefully evaluate the care recipient's current physical health status, vital signs, and overall physical condition.", "as": "සේවාලාභියාගේ වත්මන් ශාරීරික සෞඛ්‍ය තත්ත්වය සහ ජීව සංඥා ප්‍රවේශමෙන් තක්සේරු කිරීම.", "p": 193, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 103, "qe": "What must a care worker prioritize while helping a care recipient wash their hair?", "qs": "සේවාලාභියාගේ කොණ්ඩය සේදීමට උදව් කිරීමේදී සත්කාරකයා ප්‍රමුඛත්වය දිය යුත්තේ කුමන කරුණටද?", "ae": "Verify the water temperature carefully and frequently check the client's facial comfort and breathing safety during the procedure.", "as": "ජලයේ උෂ්ණත්වය පරීක්ෂා කිරීම සහ සේවාලාභියාගේ මුහුණේ සුවපහසුව හා ශ්වසන ආරක්ෂාව නිරන්තරයෙන් පරීක්ෂා කිරීම.", "p": 196, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 104, "qe": "What clinical manifestation describes stress urinary incontinence in older adults?", "qs": "වැඩිහිටියන්ගේ පීඩන ආතති මුත්‍රා අසංයමය විස්තර කරන්නේ කුමන සායනික ලක්ෂණයෙන්ද?", "ae": "Involuntary leakage of urine that occurs during sudden physical exertion, coughing, laughing, or heavy lifting due to weakened pelvic muscles.", "as": "කැස්ස, සිනාව හෝ බර ඉසිලීමේදී මුත්‍රා කාන්දු වීම.", "p": 161, "tc": "EXCRETION", "mt": "මලපහ සහ මුත්‍රා බැහැර කිරීම (Excretion)", "st": "මුත්‍‍රා අසංයමය, ජංගම වැසිකිළි සහ ඩයපර්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 105, "qe": "What shape does a healthy human vertebral column form when viewed from a lateral side profile?", "qs": "නිරෝගී මිනිස් කොඳු ඇට පෙළක් පැත්තක සිට බලන විට කුමන හැඩයක් සාදයිද?", "ae": "An S-shaped curve that provides mechanical shock absorption and spinal balance.", "as": "S හැඩැති වක්‍රයක් (S-shaped curve).", "p": 59, "tc": "VITAL", "mt": "ශරීර කෘත්‍ය සහ සෞඛ්‍ය (Body Functions)", "st": "ජීව සංඥා, ඔස්ටියෝපොරෝසිස් සහ හෝමියෝස්ටේසිස්", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 106, "qe": "When preparing to execute a bed-to-wheelchair transfer, how should the bed height be adjusted to maximize safety?", "qs": "ඇඳෙන් රෝද පුටුවට මාරු කිරීමක් සිදු කිරීමට සූදානම් වීමේදී ආරක්ෂාව උපරිම කර ගැනීමට ඇඳේ උස සකස් කළ යුත්තේ කෙසේද?", "ae": "Calibrate the bed height so that both feet of the care recipient rest firmly flat on the floor surface when they sit on the edge.", "as": "ඇඳ කෙළවරේ වාඩි වන විට සේවාලාභියාගේ පාද දෙක බිම හොඳින් ස්පර්ශ වන පරිදි ඇඳේ උස සකස් කිරීම.", "p": 134, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 107, "qe": "What is the core philosophical pillar of the professional caregiving system implemented in Japan?", "qs": "ජපානයේ ක්‍රියාත්මක වන වෘත්තීය සාත්තු සේවා පද්ධතියේ මූලික දාර්ශනික කුළුණ කුමක්ද?", "ae": "Providing target-specific support for self-reliance and independence, ensuring clients utilize their residual functional abilities.", "as": "ස්වයං-පෝෂිතභාවය සහ ස්වාධීනත්වය සඳහා ඉලක්කගත සහයෝගය ලබා දීම.", "p": 15, "tc": "PRINCIPLES", "mt": "සාත්තු සේවා මූලධර්ම (Care Principles)", "st": "ස්වාධීනත්වයට සහය වීම සහ QOL", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 108, "qe": "Which specific regions require meticulously gentle washing during a full-body bath to maintain skin health?", "qs": "සමේ සෞඛ්‍යය පවත්වා ගැනීම සඳහා සම්පූර්ණ ශරීර ස්නානයකදී ඉතා මෘදු ලෙස සේදිය යුතු විශේෂ ප්‍රදේශ මොනවාද?", "ae": "Areas where skin folds over or makes continuous contact, such as under the breasts, abdominal creases, and between fingers or toes.", "as": "පියයුරු යට, උදරයේ රැලි සහ ඇඟිලි අතර වැනි සම එකිනෙක ස්පර්ශ වන ප්‍රදේශ.", "p": 191, "tc": "BATHING", "mt": "ස්නානය සහ පිරිසිදු කිරීම (Bathing Care)", "st": "ඇඳ මත සේදීම සහ මුහුණ පිසදැමීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 109, "qe": "What component should a care worker utilize to safely elevate the front wheels of a manual wheelchair when scaling an upward step?", "qs": "ඉහළ පඩියක් නගින විට අතින් ක්‍රියාත්මක වන රෝද පුටුවක ඉදිරිපස රෝද ආරක්ෂිතව එසවීමට සත්කාරකයා භාවිත කළ යුත්තේ කුමන කොටසද?", "ae": "Apply firm downward foot pressure onto the rear tipping lever while lifting the handles backward.", "as": "පසුපස ටිපින් ලීවරය මත පාදයෙන් තද කර හසුරුවලින් ඉහළට එසවීම.", "p": 143, "tc": "MOBILITY", "mt": "චලන සහ සහායක උපකරණ (Mobility)", "st": "රෝද පුටු, වේවැල් සහ පඩිපෙළ නැගීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 110, "qe": "How should a care worker respond using active listening when a care recipient expresses deep emotional sadness?", "qs": "සේවාලාභියෙකු දැඩි චිත්තවේගීය දුකක් ප්‍රකාශ කරන විට සක්‍‍රීය සවන්දීම භාවිතයෙන් සත්කාරකයා ප්‍රතිචාර දැක්විය යුත්තේ කෙසේද?", "ae": "Acknowledge and validate their feelings immediately by saying, \"You are feeling very sad right now, aren't you? Please tell me about it.\"", "as": "\"ඔබ දැන් බොහෝ දුකින් ඉන්නේ, නේද? ඒ ගැන මට කියන්න\" ලෙස ඔවුන්ගේ හැඟීම් අගයමින් සවන් දීම.", "p": 104, "tc": "DEMENTIA", "mt": "සන්නිවේදනය සහ ඩිමෙන්ශියාව (Dementia Care)", "st": "ඩිමෙන්ශියා සත්කාර සහ සක්‍රීය සවන්දීම", "vt": "ANSWER_GENERIC", "ic": "💡"}, {"id": 111, "qe": "What communication practice should a care worker execute before moving a client to the bathhouse?", "qs": "සේවාලාභියෙකු නාන කාමරයට ගෙන යාමට පෙර සත්කාරකයා කළ යුතු සන්නිවේදන පිළිවෙත කුමක්ද?", "ae": "Explicit
